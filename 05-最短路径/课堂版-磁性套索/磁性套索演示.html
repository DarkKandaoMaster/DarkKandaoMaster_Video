<script>
'use strict';
/* =====================================================================
   磁性套索（Intelligent Scissors, Mortensen & Barrett 1995）= 迪杰斯特拉最短路径
   课堂演示，单文件、离线。按 1920×1080 设计，按窗口大小等比缩放。
   第 1 步 抠图：像素 = 顶点，上下左右相邻连边，边权 1–9（越像边缘越小）；
                每点一下就从这一点跑一遍 Dijkstra（二叉堆）得到整张前驱图，鼠标移动时只回溯。
   第 2 步 放大：自动在刚抠出的轮廓上挑一块 6×4 像素，镜头拉近，像素变顶点，连边标权值。
   第 3 步 揭晓：在这张小图上一步一步跑 Dijkstra，最后亮出最短路径 —— 与第 1 步那段线逐像素相同。
   ===================================================================== */

// ---------------- 配色与字体（与图论系列 src/graph/theme.ts 一致） ----------------
const COL = {
  bg: '#FAF7F0', ink: '#1F2430', ink2: '#555B6B', ink3: '#959AA6', edge: '#CFC8BA',
  vStroke: '#2A2F3B', card: '#FFFFFF', cardLine: '#E5DED0',
  orange: '#E8590C', orangeDeep: '#B5460A', orangeTint: '#FBE4D5', blue: '#1C7ED6',
};
const FONT_SANS = '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif';
const FONT_MONO = 'Consolas, "Microsoft YaHei", monospace';

// ---------------- 参数 ----------------
const CFG = {
  computeLong: 800,                              // 计算用的图：长边缩到 800 像素
  photoBox: { x: 100, y: 128, w: 1720, h: 852 }, // 第 1 步照片放在这个框里（设计坐标）
  snapSeed: 4,                                   // 点击时吸附到附近梯度最大的像素（半径，计算像素）
  snapMove: 2,                                   // 鼠标移动时的吸附半径
  closeRadius: 30,                               // 回到起点多近算闭合（设计坐标 px）
  cols: 6, rows: 4,                              // 放大的小块：6×4 个像素
  spacing: 210, R: 50, gridCY: 560,              // 小图布局
  manualSteps: 3,                                // 第 3 步前几次锁定一按一步，之后再按一次就自动播放
  playEvery: 0.6,                                // 自动播放：每隔多少秒锁定一个顶点
  // 局部代价 = wG·(1−梯度) + wZ·(不是过零点) + wD·(走向和边缘方向不一致)，再除以三者之和，量化成 1–9
  wG: 0.72, wZ: 0.28, wD: 0.25,

          if (xb !== x0 + cols - 1) continue;
          if (i > 0 && inside(seg[i - 1])) continue; // A 必须是“进入小窗”的那个像素
          const run = seg.slice(i, j + 1).map((q) => { const [x, y] = idxXY(q); return [x - x0, y - y0]; });
          const Wd = makeWin(x0, y0, cols, rows);
          const a = run[0][1] * cols + run[0][0], b = run[run.length - 1][1] * cols + run[run.length - 1][0];
          const fullStates = windowTrace(Wd, a, b, true);
          const D = fullStates[fullStates.length - 1].dist;
          let runCost = 0; for (let t = 1; t < run.length; t++) { const p = run[t - 1], q = run[t]; const vp = p[1] * cols + p[0], vq = q[1] * cols + q[0]; runCost += winNeighbors(Wd, vp).find(([v]) => v === vq)[1]; }
          if (D[b] !== runCost) continue; // 理论上必等（最短路的子路也是最短路），防御一下

          if (cnt[b] !== 1) continue;      // 小图上的最短路必须唯一，才保证和第 1 步那段线逐像素相同
          const K = windowTrace(Wd, a, b, false).length - 1;

          const all = []; Wd.wr.forEach((r) => all.push(...r)); Wd.wd.forEach((r) => all.push(...r));
          const sumAll = all.reduce((s, x) => s + x, 0);
          const meanRun = runCost / (run.length - 1);

          // 路要走在中间几行，两边都看得到像素；两边像素的明暗差越大越好（一边是猫，一边是背景）
          if (run.some(([, y]) => y === 0 || y === rows - 1)) continue;
          const lum = (i2, j2) => { const c = Wd.colors[j2][i2]; return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; };
          let side = 0;
          for (let i2 = 0; i2 < cols; i2++) {
            const ys = run.filter(([x]) => x === i2).map(([, y]) => y); const lo = Math.min(...ys), hi = Math.max(...ys);

            for (let j2 = 0; j2 < rows; j2++) { if (j2 < lo) { sa += lum(i2, j2); na++; } else if (j2 > hi) { sb += lum(i2, j2); nb++; } }
            if (na && nb) side += Math.abs(sa / na - sb / nb) / 255;
          }
          side /= cols;
          let score = (meanOff - meanRun) * 3 + side * 12 + Math.min(turns, 3) * 1.5 + Math.min(Math.abs(yb2 - ya2), 2) + Math.min(distinct, 7) * 0.5;
          if (meanRun > 3) score -= (meanRun - 3) * 6;
          // 第 3 步要锁定的顶点越少越好（课堂上不拖沓），但太少就没得讲
          if (K > 12) score -= (K - 12) * 0.9;
          if (K < 7) score -= (7 - K) * 2;
          if (run.length > 12) score -= (run.length - 12) * 2;

  const bent = cands.filter((c) => c.turns >= 1);
  const pool = bent.length ? bent : cands;
  let best = pool[0]; for (const c of pool) if (c.score > best.score) best = c;
  best.trace = windowTrace(best, best.a, best.b, false);
  const last = best.trace[best.trace.length - 1];
  const path = []; for (let v = best.b; v !== -1; v = last.pred[v]) path.push([v % best.cols, (v / best.cols) | 0]);

  return best;
}

// =====================================================================
//  阶段
// =====================================================================
// draw → zoom → dots → edges → dij(k = 0..K) → reveal
const PH = { name: 'draw', t0: 0, k: 0, play: false, paused: false, playT: 0, endAt: -1, intro: true };
let toast = null;
function showToast(text) { toast = { text, t0: now() }; }
function setPhase(name, opts) {
  PH.name = name; PH.t0 = now(); PH.intro = true;
  if (opts && opts.instant) { PH.t0 = now() - 100; PH.intro = false; }
  C.live = null;
  cv.style.cursor = name === 'draw' ? 'crosshair' : 'default';
}
function resetAll() { resetContour(); PH.k = 0; stopPlay(); setPhase('draw'); }
const PHASE_DUR = { zoom: 2.8, dots: 1.3, edges: 1.4, reveal: 2.6 };

function ensureWindow() {
  if (!WIN) WIN = chooseWindow();
  if (!WIN) { showToast('这条轮廓上没挑到合适的小块，换个位置多点几下再试'); return false; }
  return true;
}
function next() {
  const t = now();
  switch (PH.name) {
    case 'draw':
      if (C.auto) { finishAutoTrace(); return; }
      if (!C.closed) {
        if (C.seeds.length >= 2) { closeContour(); return; }
        if (C.seeds.length === 0 && !P.custom) { startAutoTrace(); return; }
        showToast('先沿着轮廓点几下'); return;
      }
      if (t - C.closedAt < 1.0) { C.closedAt = t - 10; return; }
      if (!ensureWindow()) return;
      setPhase('zoom'); return;
    case 'zoom': if (t - PH.t0 < PHASE_DUR.zoom) { PH.t0 = t - 100; return; } setPhase('dots'); return;
    case 'dots': if (t - PH.t0 < PHASE_DUR.dots) { PH.t0 = t - 100; return; } setPhase('edges'); return;
    case 'edges': if (t - PH.t0 < PHASE_DUR.edges) { PH.t0 = t - 100; return; } PH.k = 0; stopPlay(); setPhase('dij'); return;
    case 'dij':
      if (PH.play) { PH.play = false; PH.paused = true; return; }          // 自动播放中：暂停
      if (PH.k < WIN.K) {
        if (PH.k < CFG.manualSteps && !PH.paused) { lockOne(t); return; }  // 前几步一按一步
        PH.play = true; PH.paused = false; PH.playT = t - CFG.playEvery; return; // 之后：自动播放 / 继续
      }
      stopPlay(); setPhase('reveal'); return;
    case 'reveal': if (t - PH.t0 < PHASE_DUR.reveal) PH.t0 = t - 100; return;
  }
}
function lockOne(t) { PH.k++; PH.t0 = t; PH.intro = false; if (PH.k >= WIN.K) PH.endAt = t; }
function stopPlay() { PH.play = false; PH.paused = false; PH.endAt = -1; }
function prev() {
  stopPlay();

    case 'draw': return;
    case 'zoom': setPhase('draw', { instant: true }); C.closedAt = now() - 10; return;
    case 'dots': setPhase('zoom', { instant: true }); return;
    case 'edges': setPhase('dots', { instant: true }); return;
    case 'dij': if (PH.k > 0) { PH.k--; PH.t0 = now() - 100; PH.intro = false; return; } setPhase('edges', { instant: true }); return;
    case 'reveal': PH.k = WIN.K; setPhase('dij', { instant: true }); return;
  }
}
// Enter：直接跳到结束（第 1 步里等于“下一步”）
function fastForward() {
  if (PH.name === 'draw') { next(); return; }
  if (PH.name === 'reveal') { PH.t0 = now() - 100; return; }
  stopPlay(); PH.k = WIN.K; setPhase('reveal');
}
// 自动播放：每隔 playEvery 秒锁定一个；终点锁定后停一下，自动进入揭晓
function stepAuto() {
  if (PH.name !== 'dij') return;
  const t = now();
  if (PH.play && PH.k < WIN.K && t - PH.playT >= CFG.playEvery) { PH.playT = t; lockOne(t); }
  if (PH.play && PH.k >= WIN.K && PH.endAt >= 0 && t - PH.endAt >= 1.0) { stopPlay(); setPhase('reveal'); }
}
function restart() {
  stopPlay();
  if (PH.name === 'draw') { resetContour(); C.closedAt = -99; return; }
  if (PH.name === 'dij' || PH.name === 'reveal') { PH.k = 0; setPhase('dij'); return; }
  setPhase('zoom');
}
function jumpTo(n) {
  stopPlay();
  if (n === 1) { setPhase('draw', { instant: true }); C.closedAt = now() - 10; return; }
  if (!C.closed) { showToast('先把轮廓闭合'); return; }
  if (!ensureWindow()) return;
  if (n === 2) setPhase('zoom');
  if (n === 3) { PH.k = 0; setPhase('dij'); }
}

// ---------------- 输入 ----------------
let hintsOn = true;
try { hintsOn = localStorage.getItem('lasso-hints') !== 'off'; } catch (e) { /* file:// 下可能不可用 */ }
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'Enter') { e.preventDefault(); fastForward(); }
  else if (k === 'r' || k === 'R') restart();
  else if (k === 'Backspace' || k === 'z' || k === 'Z') { e.preventDefault(); if (PH.name === 'draw') undoSeed(); }
  else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
  else if (k === 'h' || k === 'H') { hintsOn = !hintsOn; try { localStorage.setItem('lasso-hints', hintsOn ? 'on' : 'off'); } catch (e2) { /* 忽略 */ } }
  else if (k === 'd' || k === 'D') { DEBUG = !DEBUG; }
  else if (k === '1' || k === '2' || k === '3') jumpTo(Number(k));
});
// 右下角的“‹ / 下一步 ›”按钮（第 1 步闭合前，左键要用来落点，靠它前进）
const BTN = { prev: { x: 1648, y: 998, w: 76, h: 64 }, next: { x: 1736, y: 998, w: 168, h: 64 } };
const inRect = (p, r) => p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const prevVisible = () => PH.name !== 'draw';
function hitButton(p) { if (inRect(p, BTN.next)) return 'next'; if (prevVisible() && inRect(p, BTN.prev)) return 'prev'; return null; }
cv.addEventListener('mousemove', (e) => {
  C.mouse = toStage(e); if (!C.auto) updateLive();
  cv.style.cursor = hitButton(C.mouse) ? 'pointer' : PH.name === 'draw' && !C.closed ? 'crosshair' : 'default';
});
cv.addEventListener('mouseleave', () => { if (!C.auto) { C.mouse = null; C.live = null; } });
cv.addEventListener('click', (e) => {
  cv.focus();
  if (!P.ready) return;
  const p = toStage(e); C.mouse = p;
  const b = hitButton(p);
  if (b) { if (b === 'next') next(); else prev(); return; }
  if (PH.name !== 'draw') { next(); return; }            // 第 2、3 步：左键 = 下一步（自动播放中 = 暂停 / 继续）
  if (C.auto) return;
  if (C.closed) { if (now() - C.closedAt > 0.45) next(); return; } // 闭合后：左键 = 下一步（双击闭合的第二下不算）
  if (!insidePhoto(p)) return;
  C.lastClickT = now();
  if (nearFirstSeed(p)) { closeContour(); return; }
  const w = worldOfStage(p);
  addSeed(snap(w.x - 0.5, w.y - 0.5, CFG.snapSeed));
  updateLive();
});
cv.addEventListener('dblclick', (e) => {
  if (PH.name !== 'draw' || C.closed || C.auto || hitButton(toStage(e))) return;
  // 双击的第二下会多落一个点：如果它和前一个点几乎重合就去掉，再闭合
  const segs = C.segs;
  if (segs.length && segs[segs.length - 1].length <= 4) { C.seeds.pop(); segs.pop(); C.pred = dijkstraFrom(C.seeds[C.seeds.length - 1]).pred; }
  if (C.seeds.length >= 2) closeContour();
});
// 右键：第 1 步撤销一个点；第 2、3 步 = 上一步。一律不弹浏览器菜单
cv.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (hitButton(toStage(e))) return;
  if (PH.name === 'draw') undoSeed(); else prev();
});
// 拖一张照片进来替换（FileReader 读成 data URL，画布不会被“污染”）
let dragOn = false;
window.addEventListener('dragover', (e) => { e.preventDefault(); dragOn = true; });
window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) dragOn = false; });
window.addEventListener('drop', (e) => {
  e.preventDefault(); dragOn = false;
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || !/^image\//.test(f.type)) { showToast('请拖入一张图片（jpg / png）'); return; }

// =====================================================================
//  绘制
// =====================================================================
function text(str, x, y, size, color, opts) {
  const o = opts || {};
  ctx.font = `${o.weight || 600} ${size}px ${o.mono ? FONT_MONO : FONT_SANS}`;
  ctx.fillStyle = color; ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.baseline || 'middle';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillText(str, x, y); ctx.globalAlpha = 1;
}
function caption(str, alpha) { if (alpha > 0.001) text(str, 960, 74, 50, COL.ink, { alpha, weight: 700 }); }

// 镜头：screen = world·s + (tx, ty)，world = 计算图的像素坐标（像素 (x,y) 占 [x,x+1)×[y,y+1)）
const camFull = () => ({ s: P.k, tx: P.rect.x, ty: P.rect.y });
const gx = (i) => 960 + (i - (CFG.cols - 1) / 2) * CFG.spacing;
const gy = (j) => CFG.gridCY + (j - (CFG.rows - 1) / 2) * CFG.spacing;
const camZoom = () => ({ s: CFG.spacing, tx: gx(0) - (WIN.x0 + 0.5) * CFG.spacing, ty: gy(0) - (WIN.y0 + 0.5) * CFG.spacing });
function camAt(u) {
  const A = camFull(), B = camZoom();
  const wc = { x: WIN.x0 + CFG.cols / 2, y: WIN.y0 + CFG.rows / 2 };
  const e = easeIO(clamp01(u)), ep = easeIO(clamp01(u / 0.55));
  const s = A.s * Math.pow(B.s / A.s, e);
  const cx = lerp(wc.x * A.s + A.tx, wc.x * B.s + B.tx, ep), cy = lerp(wc.y * A.s + A.ty, wc.y * B.s + B.ty, ep);
  return { s, tx: cx - wc.x * s, ty: cy - wc.y * s };
}
function withCam(cam, fn) { ctx.save(); ctx.transform(cam.s, 0, 0, cam.s, cam.tx, cam.ty); fn(); ctx.restore(); }

function drawPhoto(cam, alpha) {
  if (alpha <= 0.001) return;
  const s = cam.s;
  const wx0 = Math.max(0, Math.floor((0 - cam.tx) / s)), wy0 = Math.max(0, Math.floor((0 - cam.ty) / s));
  const wx1 = Math.min(P.cw, Math.ceil((1920 - cam.tx) / s)), wy1 = Math.min(P.ch, Math.ceil((1080 - cam.ty) / s));
  if (wx1 <= wx0 || wy1 <= wy0) return;
  const hi = 1 - clamp01((s - 5) / 9);
  ctx.save(); ctx.globalAlpha = alpha;
  if (DEBUG && PH.name === 'draw') { ctx.imageSmoothingEnabled = false; ctx.drawImage(P.dbg, 0, 0, P.cw, P.ch, cam.tx, cam.ty, P.cw * s, P.ch * s); ctx.restore(); return; }
  if (hi < 1) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(P.small, wx0, wy0, wx1 - wx0, wy1 - wy0, cam.tx + wx0 * s, cam.ty + wy0 * s, (wx1 - wx0) * s, (wy1 - wy0) * s);
  }
  if (hi > 0) {
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.globalAlpha = alpha * hi;
    const r = P.iw / P.cw;
    ctx.drawImage(P.img, wx0 * r, wy0 * r, (wx1 - wx0) * r, (wy1 - wy0) * r, cam.tx + wx0 * s, cam.ty + wy0 * s, (wx1 - wx0) * s, (wy1 - wy0) * s);
  }
  ctx.restore();
  // 放大到一定程度后画出像素之间的细缝，让人看出“一格一格”
  const ga = clamp01((s - 24) / 50) * 0.9 * alpha;
  if (ga > 0.01) {
    ctx.save(); ctx.strokeStyle = COL.bg; ctx.globalAlpha = ga; ctx.lineWidth = Math.min(4, s * 0.025); ctx.beginPath();
    for (let x = wx0; x <= wx1; x++) { ctx.moveTo(cam.tx + x * s, cam.ty + wy0 * s); ctx.lineTo(cam.tx + x * s, cam.ty + wy1 * s); }
    for (let y = wy0; y <= wy1; y++) { ctx.moveTo(cam.tx + wx0 * s, cam.ty + y * s); ctx.lineTo(cam.tx + wx1 * s, cam.ty + y * s); }

  }
}
function pixelsPath(arr) { // 像素序号 → 世界坐标折线（像素中心）
  const p = new Path2D();
  arr.forEach((q, i) => { const x = (q % P.cw) + 0.5, y = ((q / P.cw) | 0) + 0.5; if (i) p.lineTo(x, y); else p.moveTo(x, y); });

}
function strokeWorld(cam, path, widthPx, color, alpha, halo) {

    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.globalAlpha = alpha;
    if (halo) { ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = (widthPx + halo * 2) / cam.s; ctx.stroke(path); }

}
function cutoutOverlay(cam, alpha) {
  if (alpha <= 0.001 || !C.closed) return;
  const pts = contourPixels();
  withCam(cam, () => {
    const p = new Path2D();
    p.rect(0, 0, P.cw, P.ch);
    pts.forEach((q, i) => { const x = (q % P.cw) + 0.5, y = ((q / P.cw) | 0) + 0.5; if (i) p.lineTo(x, y); else p.moveTo(x, y); });

function seedDot(x, y, r, ring) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.lineWidth = ring; ctx.strokeStyle = COL.orange; ctx.stroke();
}

function drawStep1(t) {
  const cam = camFull();
  if (!C.closed) caption('磁性套索', 1);
  drawPhoto(cam, 1);
  const cutK = C.closed ? prog(t, C.closedAt, 0.9, easeIO) : 0;
  cutoutOverlay(cam, 0.86 * cutK);
  if (C.closed) caption('抠出来了', cutK);
  const lw = 5;
  if (C.segs.length) strokeWorld(cam, pixelsPath(contourPixels()), lw, COL.orange, 1, 2.5);
  if (C.live && C.live.length > 1) strokeWorld(cam, pixelsPath(C.live), lw, COL.orange, 0.95, 2.5);
  if (!C.closed || cutK < 1) {
    C.seeds.forEach((q, i) => { const s = stageOfIdx(q); seedDot(s.x, s.y, i === 0 ? 8 : 6.5, 3); });
    if (C.mouse && !C.closed && nearFirstSeed(C.mouse)) {
      const s = stageOfIdx(C.seeds[0]); ctx.beginPath(); ctx.arc(s.x, s.y, 18 + 3 * Math.sin(t * 8), 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = COL.orange; ctx.stroke();
    }
  }
}

function drawZoom(t, u, overlay) {
  const cam = camAt(u);
  drawPhoto(cam, 1);
  cutoutOverlay(cam, 0.86 * (1 - clamp01(u / 0.45)));
  // 小窗以外淡掉
  const dimK = clamp01((u - 0.55) / 0.45) * 0.62;
  if (dimK > 0.001) {
    withCam(cam, () => {
      const p = new Path2D(); p.rect(-10, -10, P.cw + 20, P.ch + 20); p.rect(WIN.x0, WIN.y0, CFG.cols, CFG.rows);
      ctx.globalAlpha = dimK; ctx.fillStyle = COL.bg; ctx.fill(p, 'evenodd');
    });
  }
  strokeWorld(cam, pixelsPath(contourPixels()), lerp(5, 11, clamp01(u)), COL.orange, overlay === undefined ? 1 : overlay, lerp(2.5, 4, clamp01(u)));
}

function pixColor(i, j) { return WIN.colors[j][i]; }
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawDots(t, m) {
  // m：0 = 方块像素，1 = 圆点
  const S = CFG.spacing, R = CFG.R;
  if (m < 1) {
    drawZoom(t, 1, 1 - clamp01(m * 1.6));
    ctx.save(); ctx.globalAlpha = m; ctx.fillStyle = COL.bg; ctx.fillRect(-10, -10, 1940, 1100); ctx.restore();
  }
  for (let j = 0; j < CFG.rows; j++) for (let i = 0; i < CFG.cols; i++) {
    const size = lerp(S, 2 * R, m), r = lerp(0, R, m);
    ctx.save();
    ctx.globalAlpha = clamp01(m * 3);
    roundRect(gx(i) - size / 2, gy(j) - size / 2, size, size, r);
    ctx.fillStyle = rgbStr(pixColor(i, j)); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = rgbStr(hex2rgb(COL.vStroke), m); ctx.stroke();
    ctx.restore();
  }
}

function edgeList() {
  const out = [];
  for (let j = 0; j < CFG.rows; j++) for (let i = 0; i < CFG.cols; i++) {
    const v = j * CFG.cols + i;
    if (i < CFG.cols - 1) out.push({ a: v, b: v + 1, w: WIN.wr[j][i], i, j, horiz: true });
    if (j < CFG.rows - 1) out.push({ a: v, b: v + CFG.cols, w: WIN.wd[j][i], i, j, horiz: false });
  }
  return out;
}
const vx = (v) => gx(v % CFG.cols), vy = (v) => gy((v / CFG.cols) | 0);
function edgeStyle(w) { const k = (w - 1) / 8; return { width: lerp(13, 3, Math.pow(k, 0.8)), color: mixHex(COL.ink, COL.edge, Math.pow(k, 0.7)) }; }
function drawEdgeLine(a, b, k, width, color, alpha) {

  const R = CFG.R; const x1 = vx(a), y1 = vy(a), x2 = vx(b), y2 = vy(b); const L = Math.hypot(x2 - x1, y2 - y1);
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L; const sx = x1 + ux * R * 0.9, sy = y1 + uy * R * 0.9, ex = x2 - ux * R * 0.9, ey = y2 - uy * R * 0.9;

function drawWeight(e, k, alpha, hot) {

  const x = (vx(e.a) + vx(e.b)) / 2, y = (vy(e.a) + vy(e.b)) / 2; const sc = easeBack(clamp01(k));
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(sc, sc);

  ctx.lineWidth = 2; ctx.strokeStyle = hot ? COL.orange : COL.cardLine; ctx.stroke();

function drawEdgesPhase(t, appear) {

  for (const e of E) { const k = appear(e); const st = edgeStyle(e.w); drawEdgeLine(e.a, e.b, k, st.width, st.color, 1); }

    const i = v % CFG.cols, j = (v / CFG.cols) | 0; let x = gx(i), y = gy(j), al = 'center';
    if (i === 0) { x -= CFG.R + 24; al = 'right'; } else if (i === CFG.cols - 1) { x += CFG.R + 24; al = 'left'; } else { y -= CFG.R + 36; }

function distStr(d) { return d >= INF ? '∞' : String(d); }
function drawDij(t, k, revealT) {
  const st = WIN.trace[k], prevSt = k > 0 ? WIN.trace[k - 1] : null;
  const dt = PH.name === 'dij' ? t - PH.t0 : 99;
  const introK = PH.name === 'dij' && k === 0 && PH.intro ? prog(t, PH.t0, 0.7, easeOut) : 1;
  const E = edgeList();

  if (revealT !== undefined) {
    WIN.path.forEach(([i, j]) => pathSet.add(j * CFG.cols + i));
    for (let q = 1; q < WIN.path.length; q++) { const a = WIN.path[q - 1][1] * CFG.cols + WIN.path[q - 1][0], b = WIN.path[q][1] * CFG.cols + WIN.path[q][0]; pathEdges.add(Math.min(a, b) + ',' + Math.max(a, b)); }
  }
  const dimK = revealT !== undefined ? prog(revealT, 0.9, 0.6) * 0.72 : 0;
  // 揭晓：照片里这一小块像素淡淡地回到背后

    const pa = prog(revealT, 1.3, 0.8) * 0.32;
    if (pa > 0) {
      const S = CFG.spacing; ctx.save(); ctx.globalAlpha = pa;
      for (let j = 0; j < CFG.rows; j++) for (let i = 0; i < CFG.cols; i++) { ctx.fillStyle = rgbStr(pixColor(i, j)); ctx.fillRect(gx(i) - S / 2, gy(j) - S / 2, S + 0.5, S + 0.5); }
      ctx.restore();

  }
  // 边

    const s = edgeStyle(e.w); const onPath = pathEdges.has(e.a + ',' + e.b);
    drawEdgeLine(e.a, e.b, 1, s.width, s.color, onPath ? 1 : 1 - dimK);

    const onPath = pathEdges.has(Math.min(v, st.pred[v]) + ',' + Math.max(v, st.pred[v]));
    const born = prevSt && !prevSt.locked[v] ? prog(dt, 0, 0.45, easeOut) : 1;
    drawEdgeLine(st.pred[v], v, born, 12, COL.orange, (onPath ? 0.55 : 0.4 * (1 - dimK)));

  // 刚松弛的边一闪
  if (st.u >= 0 && dt < 1.2) {

  if (revealT !== undefined) {

    for (let q = 1; q <= n; q++) {

function drawButtons(t) {

    roundRect(r.x, r.y, r.w, r.h, 16); ctx.fillStyle = hover ? '#FFFFFF' : 'rgba(255,255,255,0.7)'; ctx.fill();

  else s = '点击 / 空格 / →：下一步　右键 / ←：上一步　Enter：跳到结束　R：重来　1 2 3：跳步　F：全屏　H：隐藏提示';

  ['抠图', '放大', '揭晓'].forEach((n, i) => text(`${i + 1} ${n}`, 24 + i * 108, 1031, 22, i + 1 === step ? COL.orange : COL.ink3, { align: 'left', weight: i + 1 === step ? 700 : 400 }));
}
function drawToast(t) {

  ctx.save(); ctx.globalAlpha = a; ctx.font = `600 38px ${FONT_SANS}`; const w = ctx.measureText(toast.text).width + 60;
  roundRect(960 - w / 2, 960, w, 70, 35); ctx.fillStyle = 'rgba(31,36,48,0.86)'; ctx.fill(); ctx.restore();

function render() {

  baseTransform();

  const dt = t - PH.t0;
  switch (PH.name) {
    case 'draw': drawStep1(t); break;
    case 'zoom': {
      const u = clamp01(dt / PHASE_DUR.zoom);

    case 'dots': {

    case 'edges': {

function loop() { if (!REC) render(); requestAnimationFrame(loop); }

// ---------------- 给测试 / 录屏用的接口 ----------------
window.__demo = {

  render,
  state() { return { phase: PH.name, k: PH.k, K: WIN ? WIN.K : null, play: PH.play, paused: PH.paused, closed: C.closed, seeds: C.seeds.length, win: WIN ? { x0: WIN.x0, y0: WIN.y0, same: WIN.same, score: WIN.score } : null }; },

loadPhoto(PHOTO_DATA_URI, false).then(() => { window.__demoReady = true; });
requestAnimationFrame(loop);
