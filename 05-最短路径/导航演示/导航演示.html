function render() {
  const t = now();
  stepAuto();
  const dt = t - PH.t0;
  // ---- 地图平面的镜头 ----
  let lay = LAY.nav;
  if (PH.name === 'tilt') lay = mixLay(PH.layFrom || LAY.nav, LAY.graph, prog(dt, 0, 1.5, easeIO));
  else if (PH.name === 'edges') lay = mixLay(PH.layFrom || LAY.graph, LAY.graph, prog(dt, 0, 0.6, easeIO));
  else if (PH.name === 'dij') lay = mixLay(PH.layFrom || LAY.graph, LAY.dij, prog(dt, 0, 0.9, easeIO));
  else if (PH.name === 'reveal') lay = LAY.dij;
  else lay = mixLay(PH.layFrom && PH.name === 'nav' ? PH.layFrom : LAY.nav, LAY.nav, prog(dt, 0, 0.6, easeIO));
  if (PH.name === 'dij' && !PH.intro) lay = LAY.dij;

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  baseTransform();
  switch (PH.name) {

      break;
    }
    case 'nav': {

      navCard(show.card, show.card);

      break;

      const fade = 1 - prog(dt, 0, 0.5), fade2 = 1 - prog(dt, 0.9, 0.6);
      drawNavLayer(t, 1, { labels: fade, pinS: 1, pinT: 1, pinA: fade2, route: 1, routeA: fade2, arrows: fade2 });
      navCard(fade, 1);
      const order = VS.map((v, i) => i).sort((a, b) => VS[a].xy[0] - VS[b].xy[0]);
      drawGraph(t, { vk: (i) => prog(dt, 1.1 + 0.09 * order.indexOf(i), 0.45), ek: () => 0, pk: () => 0, nameA: prog(dt, 1.9, 0.4) });
      caption('路口 → 顶点', prog(dt, 1.0, 0.5));
      break;
    }
    case 'edges': {
      drawGraph(t, { ek: (i) => prog(dt, 0.08 * i, 0.6, easeOut), pk: (i) => prog(dt, 0.45 + 0.08 * i, 0.4) });
      caption('路口 → 顶点', 1 - prog(dt, 0, 0.4));
      caption('路段 → 边，边上标长度（米）', prog(dt, 0.3, 0.5));
      break;
    }
    case 'dij': {
      const st = TR.states[PH.k], prevSt = PH.k > 0 ? TR.states[PH.k - 1] : null;
      const ldt = PH.intro && PH.k === 0 ? dt - 0.7 : dt;
      const shown = PH.intro && PH.k === 0 && dt < 0.7 ? null : st;
      drawGraph(t, { st: shown, prevSt, dt: ldt });
      drawTable(shown || TR.states[0], prevSt, ldt, prog(t - PH.dijT0, 0.15, 0.7, easeOut), shown ? {} : { final: true });
      caption('迪杰斯特拉：每次锁定 dist 最小的顶点', PH.intro && PH.k === 0 ? prog(dt, 0.2, 0.5) : 1, 640);
      if (PH.k === 0 && !(PH.intro && dt < 0.7)) text('初始化：起点放进 S，起点的邻居 dist = 边长', 640, 140, 30, COL.ink2, { weight: 500, halo: 8, alpha: PH.intro ? prog(dt, 0.9, 0.5) : 1 });
      else if (PH.k > 0) {
        const u = st.u; const dec = st.dec;
        let msg = `第 ${PH.k} 次：锁定 ${vShort(u)}（dist = ${st.dist[u]}）`;
        if (u === PAIR.t) msg = `第 ${PH.k} 次：锁定终点 ${vShort(u)}，结束`;
        text(msg, 640, 140, 32, u === PAIR.t ? COL.orangeDeep : COL.ink2, { weight: 600, halo: 8 });
        if (dec.length) {
          const d0 = dec[0];
          text(`${vShort(d0.v)}：${d0.old} → ${d0.nu}，找到更近的路了！`, 640, 190, 34, COL.red, { weight: 800, halo: 8, alpha: prog(ldt, 0.3, 0.4) });
        }
      }
      break;
    }
    case 'reveal': {
      const st = TR.states[TR.K];
      drawGraph(t, { st, dt: 99, final: true, reveal: dt, path: TR.path });
      const pathStr = TR.path.map(vShort).join(' → ');
      drawTable(st, null, 99, 1, { final: true, path: TR.path, reveal: prog(dt, 0.2, 0.6), summary: `${pathStr} = ${TR.dist} 米`, summaryA: prog(dt, 0.6, 0.5) });
      caption('迪杰斯特拉：每次锁定 dist 最小的顶点', 1 - prog(dt, 0, 0.4), 640);
      const tk = prog(dt, 1.9, 0.6, easeOut);
      bigLine([['导航给你的路线 ', COL.ink], ['=', COL.orange], [' 最短路径', COL.ink]], 74, 72, tk, tk);
      const tk2 = prog(dt, 2.4, 0.5, easeOut);
      bigLine([[`全程 ${TR.dist} 米`, COL.blue], ['  =  ', COL.ink3], [`dist[${VS[PAIR.t].short}] = ${TR.dist}`, COL.orangeDeep]], 156, 40, tk2, tk2, 640);
      break;
    }
  }
  if (DEBUG) VS.forEach((v, i) => { const p = vertexPos(i); ctx.save(); ctx.strokeStyle = '#FF00FF'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x - 14, p.y); ctx.lineTo(p.x + 14, p.y); ctx.moveTo(p.x, p.y - 14); ctx.lineTo(p.x, p.y + 14); ctx.stroke(); ctx.restore(); });
  drawToast(t); drawHints(); drawButtons(); drawCursor();
}
function loop() { if (!REC) render(); requestAnimationFrame(loop); }

// ---------------- 给测试 / 录屏用的接口 ----------------
window.__demo = {
  setTime(t) { manualT = t; render(); },
  render,
  state() { return { phase: PH.name, k: PH.k, K: TR.K, play: PH.play, paused: PH.paused, start: VS[PAIR.s].id, end: VS[PAIR.t].id, mode: PAIR.mode, dist: TR.dist }; },
  next, prev, fastForward, restart, jumpTo,
  setPair(s, t) { setPairTo(VI[s], VI[t]); },
  setMode(m) { PAIR.mode = m; },
  proj(x, y) { return proj(x, y); },
  clientOfStage(x, y) { return { x: VIEW.ox + x * VIEW.s, y: VIEW.oy + y * VIEW.s }; },
  labelHits() { return LABEL_HITS.map((h) => ({ vid: h.vid, x: h.x + h.w / 2, y: h.y + h.h / 2 })); },
  exportCheck() {
    const s = PAIR.s, t = PAIR.t;
    return {
      vertices: VS.map((v) => ({ id: v.id, letter: v.letter, bld: v.bld, xy: v.xy })),
      edges: ES.map((e) => ({ u: VS[e.a].id, v: VS[e.b].id, w: e.w })),
      start: VS[s].id, end: VS[t].id, K: TR.K,
      trace: TR.states.map((x) => ({ dist: x.dist.map((d) => (d >= INF ? null : d)), pred: x.pred.map((p) => (p < 0 ? null : VS[p].id)), locked: x.locked, u: VS[x.u].id, changed: x.changed.map((c) => VS[c].id), dec: x.dec.map((q) => ({ v: VS[q.v].id, old: q.old, nu: q.nu })), tie: x.tie })),
      navPath: TR.path.map((i) => VS[i].id), navDist: TR.dist, walkMin: walkMin(TR.dist), navPts: TR.pts,
      cardText: `全程 ${TR.dist} 米 · 步行约 ${walkMin(TR.dist)} 分钟`,
    };
  },
};
applyPlane();
window.__demoReady = false;
(function waitReady() { if (handReady || HAND.complete) { window.__demoReady = true; } else setTimeout(waitReady, 30); })();
requestAnimationFrame(loop);
</script>
