<!DOCTYPE html>

<canvas id="cv" tabindex="0"></canvas>
<script>const NET = /*NETWORK*/null;</script>
<script>const HAND_URI = "__HAND_URI__";</script>
<script>
'use strict';
/* =====================================================================
   用湖州师范学院东校区的"导航"引出最短路径（迪杰斯特拉）。课堂演示，单文件、离线，不配音。
   按 1920×1080 设计，按窗口大小等比缩放。翻页笔每按一下走一步：
   1 导入：手绘地图 + 问题 → 导航风格地图（矢量，按 2023 年体育场地分布图描），起终点图钉 + 蓝色路线 + 全程 xxx 米
   2 变成图：地图往后放倒、变淡（CSS 3D），路口 → 顶点，路段 → 边，边上标长度（米）
   3 迪杰斯特拉：右边一张大字表（顶点 / dist / path），前 3 次一按一步，之后自动播放，终点锁定就停
   4 揭晓：最短路径亮起来，和第 1 步的蓝色路线重合
   地图坐标 = 体育场地分布图（7356×4112）的像素坐标；长度在总平面图上按比例尺量（见 README）。
   ===================================================================== */

// ---------------- 配色与字体 ----------------
const COL = {
  bg: '#F4F6F8', ink: '#1F2430', ink2: '#555B6B', ink3: '#959AA6', line: '#E3E6EB',
  card: '#FFFFFF', cardLine: '#E5E8ED',
  orange: '#E8590C', orangeDeep: '#B5460A', orangeTint: '#FDE8DA',
  blue: '#2F7BF5', blueDeep: '#1A5FD1', green: '#1FAA59', red: '#E5484D',
  edge: '#5B6472', edgeDim: '#9AA1AD',
};
const FONT_SANS = '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif';
const FONT_MONO = 'Consolas, "Microsoft YaHei", monospace';

// ---------------- 参数 ----------------
const CFG = {
  manualSteps: 3,          // 第 3 步前几次锁定一按一步，之后再按一次就自动播放
  playEvery: 1.1,          // 自动播放：每隔多少秒锁定一个顶点
  decDwell: 1.0,           // 自动播放中有"改小"时多停一会儿
  walkPerMin: 80,          // 步行速度（米/分钟），步行时间向上取整
  R: 30,                   // 顶点圆半径（屏幕像素）
};
// 地图底图的范围（体育场地分布图像素），和 build_map.py 一致
const WIN = { x0: 3440, y0: 1200, w: 1580, h: 980 };
// 各阶段的"镜头"：地图平面先缩放平移（k、ox/oy → sx/sy），再绕水平轴往后倒 th，透视距离 P，透视原点 (px, py)，不透明度 a
const DEG = Math.PI / 180;
const LAY = {
  nav:   { k: 1.263, ox: 4230, oy: 1690, sx: 960, sy: 540, th: 0,       P: 1700, px: 960, py: 540, a: 1 },
  graph: { k: 1.22,  ox: 4205, oy: 1640, sx: 960, sy: 590, th: 40 * DEG, P: 1700, px: 960, py: 430, a: 0.42 },
  dij:   { k: 0.86,  ox: 4205, oy: 1640, sx: 660, sy: 610, th: 36 * DEG, P: 1700, px: 660, py: 450, a: 0.36 },
};
// 手绘地图上各楼的位置（手绘地图 1920×942 像素），第 1 步导入时画圈
const HAND_XY = { '生命科学学院': [1305, 515], '32号教学楼': [1205, 280], '数字图书馆': [1105, 510], '明达楼': [980, 440], '和润楼': [1525, 255], '北门': [1285, 118] };
// 顶点名字（起终点显示楼名）放在顶点的哪一侧（屏幕像素偏移）
const NAME_OFF = { W: [-20, -62], LN: [-30, 62], X: [0, -64], L: [10, 64], N: [70, -30], M: [60, -52], J: [40, 62], C: [10, -64] };
// 导航底图上的文字（体育场地分布图坐标）。kind: bld = 可以点选的楼（vid = 对应顶点）；poi；road（沿 a→b 方向）；water
const MAP_LABELS = [
  { kind: 'bld', text: '生命科学学院', x: 4470, y: 2008, vid: 'J' },
  { kind: 'bld', text: '32号教学楼', x: 4028, y: 1556, vid: 'X' },
  { kind: 'bld', text: '数字图书馆', x: 3812, y: 2020, vid: 'L' },
  { kind: 'bld', text: '明达楼', x: 3545, y: 1812, vid: 'W' },
  { kind: 'bld', text: '和润楼', x: 4846, y: 1282, vid: 'C' },
  { kind: 'bld', text: '北门', x: 4203, y: 1300, vid: 'N' },
  { kind: 'poi', text: '工学院', x: 4150, y: 1800 },
  { kind: 'poi', text: '30号教学楼', x: 4520, y: 1450 },
  { kind: 'poi', text: '创新创业中心', x: 3760, y: 1458 },
  { kind: 'poi', text: '国际学院', x: 4040, y: 1428 },
  { kind: 'poi', text: '鹊望亭', x: 4492, y: 1772 },
  { kind: 'poi', text: '安吉园', x: 4800, y: 1950 },
  { kind: 'water', text: '德清湖', x: 4660, y: 1680 },
  { kind: 'road', text: '明达路', x: 4560, y: 1537, a: [4500, 1550], b: [4600, 1524] },
  { kind: 'road', text: '梁希路', x: 4288, y: 1735, a: [4290, 1700], b: [4318, 1800] },
  { kind: 'road', text: '郑凝路', x: 3862, y: 1758, a: [3862, 1700], b: [3862, 1800] },
  { kind: 'road', text: '学府路', x: 3700, y: 1390, a: [3680, 1392], b: [3740, 1387] },
];

const QS = new URLSearchParams(location.search);
const REC = QS.has('record');            // 录屏模式：手动时钟 + 画一个假鼠标
const DEBUG = QS.get('debug') === 'proj'; // 调试：任何阶段都画出投影后的顶点，核对和底图是否对齐

// ---------------- 小工具 ----------------
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, start, dur, ease) => { const x = clamp01((t - start) / dur); return ease ? ease(x) : x; };
const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbStr = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const mixHex = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return rgbStr([lerp(x[0], y[0], t), lerp(x[1], y[1], t), lerp(x[2], y[2], t)]); };

let manualT = 0;
const now = () => (REC ? manualT : performance.now() / 1000);

// ---------------- 画布、舞台与缩放 ----------------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stageEl = document.getElementById('stage'), perspEl = document.getElementById('persp'), planeEl = document.getElementById('plane');
let VIEW = { s: 1, ox: 0, oy: 0, dpr: 1 };
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const s = Math.min(w / 1920, h / 1080);
  VIEW = { s, ox: (w - 1920 * s) / 2, oy: (h - 1080 * s) / 2, dpr };
  stageEl.style.transform = `translate(${VIEW.ox}px, ${VIEW.oy}px) scale(${s})`;
}
window.addEventListener('resize', resize);
resize();
const baseTransform = () => ctx.setTransform(VIEW.dpr * VIEW.s, 0, 0, VIEW.dpr * VIEW.s, VIEW.dpr * VIEW.ox, VIEW.dpr * VIEW.oy);
const toStage = (e) => ({ x: (e.clientX - VIEW.ox) / VIEW.s, y: (e.clientY - VIEW.oy) / VIEW.s });

// ---------------- 地图平面（CSS 3D）与投影 ----------------
// 世界坐标（体育场地分布图像素）→ 舞台坐标：和 CSS 的 perspective + rotateX 用同一套公式，
// 所以画在画布上的顶点、数字（不随地图倾斜，始终正对观众）正好落在倾斜后的地图上。
let PL = Object.assign({}, LAY.nav);
function mixLay(A, B, u) { const o = {}; for (const k in A) o[k] = lerp(A[k], B[k], u); return o; }
function proj(wx, wy) {
  const dx = (wx - PL.ox) * PL.k, dy = (wy - PL.oy) * PL.k;
  const c = Math.cos(PL.th), s = Math.sin(PL.th);
  const x = PL.sx + dx, y = PL.sy + dy * c, z = dy * s;
  const f = PL.P / (PL.P - z);
  return { x: PL.px + (x - PL.px) * f, y: PL.py + (y - PL.py) * f, f };
}
function applyPlane() {
  const ox = (PL.ox - WIN.x0) * PL.k, oy = (PL.oy - WIN.y0) * PL.k;
  planeEl.style.left = (PL.sx - ox) + 'px';
  planeEl.style.top = (PL.sy - oy) + 'px';
  planeEl.style.width = (WIN.w * PL.k) + 'px';
  planeEl.style.height = (WIN.h * PL.k) + 'px';
  planeEl.style.transformOrigin = `${ox}px ${oy}px`;
  planeEl.style.transform = `rotateX(${PL.th}rad)`;
  planeEl.style.opacity = PL.a;
  perspEl.style.perspective = PL.P + 'px';
  perspEl.style.perspectiveOrigin = `${PL.px}px ${PL.py}px`;
}

// =====================================================================
//  图（顶点 / 边）与迪杰斯特拉
// =====================================================================
const VS = NET.vertices;                       // [{id, xy, letter, bld, short, note}]
const VI = {}; VS.forEach((v, i) => { VI[v.id] = i; });
const ES = NET.edges.map((e) => ({ a: VI[e.u], b: VI[e.v], w: e.w, pts: e.pts, road: e.road }));
const ADJ = VS.map(() => []);
ES.forEach((e, i) => { ADJ[e.a].push({ to: e.b, w: e.w, e: i }); ADJ[e.b].push({ to: e.a, w: e.w, e: i }); });
const INF = 1e9;
function edgeBetween(a, b) { for (const x of ADJ[a]) if (x.to === b) return x.e; return -1; }
function edgePts(a, b) { const e = ES[edgeBetween(a, b)]; return e.a === a ? e.pts : e.pts.slice().reverse(); }
function pathPts(path) { const out = []; for (let i = 1; i < path.length; i++) { const p = edgePts(path[i - 1], path[i]); p.forEach((q, j) => { if (i === 1 || j > 0) out.push(q); }); } return out; }

// 课堂上看到的那一版迪杰斯特拉（照教材）：
//   初始化：起点放进 S（dist = 0），起点的邻居 dist = 边长、path = 起点，其余 ∞；
//   之后每次锁定"没锁定的里 dist 最小的"（同距离取编号小的，测试会检查有没有同距离），用它更新邻居；
//   终点一被锁定就停（不再用终点更新别人）。
function dijTrace(s, t) {
  const n = VS.length;
  const dist = Array(n).fill(INF), pred = Array(n).fill(-1), locked = Array(n).fill(false), struck = Array(n).fill(null);
  dist[s] = 0; locked[s] = true;
  const ch0 = [];
  for (const { to, w } of ADJ[s]) { dist[to] = w; pred[to] = s; ch0.push(to); }
  const states = [{ dist: dist.slice(), pred: pred.slice(), locked: locked.slice(), struck: struck.slice(), u: s, changed: ch0, dec: [], tie: false }];
  for (;;) {
    let u = -1, tie = false;
    for (let v = 0; v < n; v++) {
      if (locked[v] || dist[v] >= INF) continue;
      if (u < 0 || dist[v] < dist[u]) { u = v; tie = false; } else if (dist[v] === dist[u]) tie = true;
    }
    if (u < 0) break;
    locked[u] = true; const changed = [], dec = [];
    if (u !== t) {
      for (const { to, w } of ADJ[u]) {
        if (locked[to] || dist[u] + w >= dist[to]) continue;
        if (dist[to] < INF) { dec.push({ v: to, old: dist[to], nu: dist[u] + w }); struck[to] = dist[to]; }
        dist[to] = dist[u] + w; pred[to] = u; changed.push(to);
      }
    }
    states.push({ dist: dist.slice(), pred: pred.slice(), locked: locked.slice(), struck: struck.slice(), u, changed, dec, tie });
    if (u === t) break;
  }
  return states;
}
function pathFromPred(pred, s, t) { const p = []; for (let v = t; v !== -1; v = pred[v]) { p.push(v); if (v === s) break; } return p.reverse(); }

// 当前起终点和对应的数据
const PAIR = { s: VI[NET.default.start], t: VI[NET.default.end], mode: 'end' };
let TR = null;
function computePair() {
  const states = dijTrace(PAIR.s, PAIR.t);
  const last = states[states.length - 1];
  const path = pathFromPred(last.pred, PAIR.s, PAIR.t);
  TR = { states, K: states.length - 1, path, dist: last.dist[PAIR.t], pts: pathPts(path) };
}
computePair();
const vName = (i) => VS[i].bld || VS[i].letter;
const vShort = (i) => (i === PAIR.s || i === PAIR.t ? VS[i].short : VS[i].letter);
const walkMin = (d) => Math.max(1, Math.ceil(d / CFG.walkPerMin));

// =====================================================================
//  阶段
// =====================================================================
// intro → nav → tilt → edges → dij(k = 0..K) → reveal
const PH = { name: 'intro', t0: 0, k: 0, play: false, paused: false, playT: 0, endAt: -1, intro: true, navT0: 0, dijT0: -100, layFrom: null };
const PHASE_DUR = { intro: 0.6, nav: 3.4, tilt: 2.4, edges: 1.8, dijIn: 1.0, reveal: 3.2 };
let toast = null;
function showToast(text) { toast = { text, t0: now() }; }
function setPhase(name, opts) {
  PH.layFrom = Object.assign({}, PL);
  PH.name = name; PH.t0 = now(); PH.intro = true;
  if (opts && opts.instant) { PH.t0 = now() - 100; PH.intro = false; }
  if (name === 'nav') PH.navT0 = PH.t0;
  if (name === 'dij') PH.dijT0 = PH.t0;
}
function stepOf(name) { return name === 'intro' || name === 'nav' ? 1 : name === 'tilt' || name === 'edges' ? 2 : name === 'dij' ? 3 : 4; }
function next() {
  const t = now(), dt = t - PH.t0;
  switch (PH.name) {
    case 'intro': if (dt < PHASE_DUR.intro) { PH.t0 = t - 100; return; } setPhase('nav'); return;
    case 'nav': if (t - PH.navT0 < PHASE_DUR.nav) { PH.navT0 = t - 100; PH.t0 = t - 100; return; } setPhase('tilt'); return;
    case 'tilt': if (dt < PHASE_DUR.tilt) { PH.t0 = t - 100; return; } setPhase('edges'); return;
    case 'edges': if (dt < PHASE_DUR.edges) { PH.t0 = t - 100; return; } PH.k = 0; stopPlay(); setPhase('dij'); return;
    case 'dij':
      if (PH.intro && dt < PHASE_DUR.dijIn) { PH.t0 = t - 100; PH.intro = false; return; }
      if (PH.play) { PH.play = false; PH.paused = true; return; }          // 自动播放中：暂停
      if (PH.k < TR.K) {
        if (PH.k < CFG.manualSteps && !PH.paused) { lockOne(t); return; }  // 前几步一按一步
        PH.play = true; PH.paused = false; PH.playT = t - CFG.playEvery; return; // 之后：自动播放 / 继续
      }
      stopPlay(); setPhase('reveal'); return;
    case 'reveal': if (dt < PHASE_DUR.reveal) PH.t0 = t - 100; return;
  }
}
function lockOne(t) { PH.k++; PH.t0 = t; PH.intro = false; if (PH.k >= TR.K) PH.endAt = t; }
function stopPlay() { PH.play = false; PH.paused = false; PH.endAt = -1; }
function prev() {
  stopPlay();
  switch (PH.name) {
    case 'intro': return;
    case 'nav': setPhase('intro', { instant: true }); return;
    case 'tilt': setPhase('nav', { instant: true }); PH.navT0 = now() - 100; return;
    case 'edges': setPhase('tilt', { instant: true }); return;
    case 'dij': if (PH.k > 0) { PH.k--; PH.t0 = now() - 100; PH.intro = false; return; } setPhase('edges', { instant: true }); return;
    case 'reveal': PH.k = TR.K; setPhase('dij', { instant: true }); return;
  }
}
// Enter：第 3 步直接跳到结束（揭晓）；别处等于"下一步"
function fastForward() {
  if (PH.name === 'dij') { stopPlay(); PH.k = TR.K; setPhase('reveal'); return; }
  if (PH.name === 'reveal') { PH.t0 = now() - 100; return; }
  next();
}
// 自动播放：每隔 playEvery 秒锁定一个；有"改小"多停一会儿；终点锁定后停一下，自动进入揭晓
function stepAuto() {
  if (PH.name !== 'dij') return;
  const t = now();
  if (PH.play && PH.k < TR.K) {
    const st = TR.states[PH.k];
    const wait = CFG.playEvery + (st && st.dec && st.dec.length ? CFG.decDwell : 0);
    if (t - PH.playT >= wait) { PH.playT = t; lockOne(t); }
  }
  if (PH.play && PH.k >= TR.K && PH.endAt >= 0 && t - PH.endAt >= 1.4) { stopPlay(); setPhase('reveal'); }
}
function restart() {
  stopPlay();
  if (PH.name === 'nav' || PH.name === 'intro') { setPairTo(VI[NET.default.start], VI[NET.default.end]); return; }
  if (PH.name === 'dij' || PH.name === 'reveal') { PH.k = 0; setPhase('dij', { instant: true }); return; }
  setPhase(PH.name);
}
function jumpTo(n) {
  stopPlay();
  if (n === 1) { setPhase('intro'); return; }
  if (n === 2) { PL = Object.assign({}, LAY.nav); setPhase('tilt'); return; }
  if (n === 3) { PH.k = 0; PL = Object.assign({}, LAY.graph); setPhase('dij'); return; }
  if (n === 4) { PH.k = TR.K; PL = Object.assign({}, LAY.graph); setPhase('reveal'); }
}
function setPairTo(s, t) {
  if (s === t) { showToast('起点和终点不能是同一栋楼'); return; }
  PAIR.s = s; PAIR.t = t; computePair(); PH.k = 0;
  if (PH.name === 'nav') PH.navT0 = now() - 0.75; // 图钉重新落下、蓝线重新画
}
function pickBuilding(vid) {
  const i = VI[vid];
  if (PAIR.mode === 'end') { if (i === PAIR.s) { showToast('这是起点，换一栋楼当终点'); return; } setPairTo(PAIR.s, i); }
  else { if (i === PAIR.t) { showToast('这是终点，换一栋楼当起点'); return; } setPairTo(i, PAIR.t); }
}

// ---------------- 输入 ----------------
let hintsOn = true;
try { hintsOn = localStorage.getItem('nav-hints') !== 'off'; } catch (e) { /* file:// 下可能不可用 */ }
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'Enter') { e.preventDefault(); fastForward(); }
  else if (k === 'r' || k === 'R') restart();
  else if (k === 's' || k === 'S') { if (PH.name === 'nav') PAIR.mode = PAIR.mode === 'end' ? 'start' : 'end'; }
  else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
  else if (k === 'h' || k === 'H') { hintsOn = !hintsOn; try { localStorage.setItem('nav-hints', hintsOn ? 'on' : 'off'); } catch (e2) { /* 忽略 */ } }
  else if (k === '1' || k === '2' || k === '3' || k === '4') jumpTo(Number(k));
});
const BTN = { prev: { x: 1648, y: 998, w: 76, h: 64 }, next: { x: 1736, y: 998, w: 168, h: 64 }, mode: { x: 620, y: 928, w: 420, h: 58 } };
const inRect = (p, r) => p && r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
let MOUSE = null;
let LABEL_HITS = [];   // 第 1 步导航地图上可以点的楼名（每帧更新）
function hitButton(p) {
  if (inRect(p, BTN.next)) return 'next';
  if (PH.name !== 'intro' && inRect(p, BTN.prev)) return 'prev';
  if (PH.name === 'nav' && inRect(p, BTN.mode)) return 'mode';
  return null;
}
function hitLabel(p) { if (PH.name !== 'nav') return null; for (const h of LABEL_HITS) if (inRect(p, h)) return h.vid; return null; }
cv.addEventListener('mousemove', (e) => {
  MOUSE = toStage(e);
  cv.style.cursor = hitButton(MOUSE) || hitLabel(MOUSE) ? 'pointer' : 'default';
});
cv.addEventListener('mouseleave', () => { MOUSE = null; });
cv.addEventListener('click', (e) => {

    // 刚松弛的边一闪
    if (st.u >= 0 && dt < 1.3 && !o.final) {
      for (const v of st.changed) { if (v === st.u) continue; const P = projPts(edgePts(st.u, v)); strokePoly(P, prog(dt, 0, 0.4, easeOut), 16, COL.orange, 0.85 * (1 - clamp01((dt - 0.5) / 0.8))); }
    }
  }
  // 揭晓：最短路径一节一节亮起来，然后导航的蓝线沿同样的路描一遍
  if (o.reveal !== undefined) {
    const P = projPts(TR.pts);
    strokePoly(P, prog(o.reveal, 0, 0.9, easeIO), 36, COL.orange, 0.9);
    navRoute(P, prog(o.reveal, 1.2, 1.1, easeIO), 1, 0);
  }
  // 权值
  ES.forEach((e, i) => {
    const k = o.pk ? o.pk(i) : 1;
    const hot = st && st.u >= 0 && dt < 1.3 && !o.final && ((ES[i].a === st.u && st.changed.includes(ES[i].b)) || (ES[i].b === st.u && st.changed.includes(ES[i].a)));
    const on = pathE.has(i);
    weightPill(i, k, on ? 1 : 1 - dimK * 0.6, hot || (on && o.reveal > 0.9), dimK > 0.3 && !on);
  });
  // 顶点
  VS.forEach((v, i) => {
    const k = o.vk ? o.vk(i) : 1;
    let style = {};
    if (st) {
      const locked = st.locked[i], isNew = st.u === i && !o.final;
      const nk = isNew ? prog(dt, 0, 0.35, easeOut) : 1;
      if (locked) style = { fill: isNew ? mixHex('#FFFFFF', COL.orange, nk) : COL.orange, stroke: COL.orangeDeep, textColor: '#FFFFFF' };
      else if (st.dist[i] < INF) style = { fill: '#FFFFFF', stroke: COL.ink };
      else style = { fill: '#FFFFFF', stroke: COL.ink3, textColor: COL.ink3 };
      if (st.changed.includes(i) && !locked && dt < 1.2 && !o.final) style.ring = COL.orange;
    }
    if (i === PAIR.s && !(st && st.locked[i])) style = Object.assign(style, { fill: COL.green, stroke: '#137A3D', textColor: '#FFFFFF' });
    if (i === PAIR.t && !(st && st.locked[i])) style = Object.assign(style, { stroke: COL.red, ring: style.ring || null });
    if (o.reveal !== undefined) {
      const on = pathV.has(i); style.alpha = on ? 1 : 1 - dimK * 0.7;
      if (!on && dimK > 0.05) style = { fill: '#FFFFFF', stroke: COL.ink3, textColor: COL.ink3, alpha: 1 - dimK * 0.6 };
      if (on) { const pk = prog(o.reveal, 0.1, 0.8); style.fill = mixHex(style.fill || '#FFFFFF', COL.orange, pk); style.stroke = COL.orangeDeep; style.textColor = '#FFFFFF'; }
    }
    vertexDot(i, k, style);
    if (st && st.u === i && dt < 0.8 && !o.final) { // 锁定时的脉冲圈
      const p = vertexPos(i), rk = clamp01(dt / 0.8);
      ctx.save(); ctx.globalAlpha = 1 - rk; ctx.beginPath(); ctx.arc(p.x, p.y, CFG.R + 6 + 34 * rk, 0, Math.PI * 2); ctx.lineWidth = 6 - 3 * rk; ctx.strokeStyle = COL.orange; ctx.stroke(); ctx.restore();
    }
  });
  VS.forEach((v, i) => vertexName(i, o.nameA === undefined ? 1 : o.nameA, o.reveal !== undefined && pathV.has(i) && o.reveal > 0.9));
}

// ---------------- 按钮、提示 ----------------
function drawButtons() {
  const one = (r, label, enabled) => {
    const hover = inRect(MOUSE, r) && enabled;
    ctx.save(); ctx.globalAlpha = enabled ? 1 : 0.4;
    roundRect(r.x, r.y, r.w, r.h, 16); ctx.fillStyle = hover ? '#FFFFFF' : 'rgba(255,255,255,0.75)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = hover ? COL.ink3 : COL.cardLine; ctx.stroke(); ctx.restore();
    text(label, r.x + r.w / 2, r.y + r.h / 2 + 1, 30, hover ? COL.ink : COL.ink2, { weight: 600, alpha: enabled ? 1 : 0.4 });
  };
  if (PH.name !== 'intro') one(BTN.prev, '‹', true);
  const label = PH.name === 'dij' && PH.play ? '暂停 ❚❚' : PH.name === 'dij' && PH.paused ? '继续 ›' : '下一步 ›';
  one(BTN.next, label, PH.name !== 'reveal');
}
function drawHints() {
  if (!hintsOn) return;
  const s = PH.name === 'nav' ? '点楼名：换起点 / 终点　S：切换　R：恢复默认　点地图 / 空格 / →：下一步　F：全屏　H：隐藏提示'
    : '点击 / 空格 / →：下一步　右键 / ←：上一步　Enter：跳到结束　R：重来　1–4：跳步　F：全屏　H：隐藏提示';
  text(s, 1628, 1031, 22, COL.ink3, { align: 'right', weight: 400, halo: 6 });
  const step = stepOf(PH.name);
  if (PH.name === 'nav') return; // 第 1 步左下角放"改起点 / 终点"
  ['导入', '变成图', '迪杰斯特拉', '揭晓'].forEach((n, i) => {
    const x = 24 + [0, 92, 210, 372][i];
    text(`${i + 1} ${n}`, x, 1031, 22, i + 1 === step ? COL.orange : COL.ink3, { align: 'left', weight: i + 1 === step ? 700 : 400, halo: 6 });
  });
}
function drawToast(t) {
  if (!toast) return; const a = 1 - prog(t, toast.t0 + 1.6, 0.4); if (a <= 0) { toast = null; return; }
  ctx.save(); ctx.globalAlpha = a; ctx.font = `600 38px ${FONT_SANS}`; const w = ctx.measureText(toast.text).width + 60;
  roundRect(960 - w / 2, 900, w, 70, 35); ctx.fillStyle = 'rgba(31,36,48,0.86)'; ctx.fill(); ctx.restore();
  text(toast.text, 960, 936, 38, '#FFFFFF', { alpha: a });
}
function drawCursor() {
  if (!REC || !MOUSE) return;
  const { x, y } = MOUSE; ctx.save(); ctx.translate(x, y); ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(8, 23); ctx.lineTo(14, 36); ctx.lineTo(20, 33); ctx.lineTo(14, 21); ctx.lineTo(24, 21); ctx.closePath();
  ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000000'; ctx.stroke(); ctx.restore();
}
function bigLine(parts, y, size, alpha, slide, cx) {
  cx = cx || 960;
  if (alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(0, (1 - slide) * 16); ctx.font = `800 ${size}px ${FONT_SANS}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const W = parts.reduce((s, [str]) => s + ctx.measureText(str).width, 0); let x = cx - W / 2;
  ctx.lineJoin = 'round'; ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(244,246,248,0.95)';
  for (const [str] of parts) { ctx.strokeText(str, x, y); x += ctx.measureText(str).width; }
  x = cx - W / 2;
  for (const [str, c] of parts) { ctx.fillStyle = c; ctx.fillText(str, x, y); x += ctx.measureText(str).width; }
  ctx.restore();
}

// =====================================================================
//  每帧
// =====================================================================
function render() {
  const t = now();
  stepAuto();
  const dt = t - PH.t0;
  // ---- 地图平面的镜头 ----
  let lay = LAY.nav;
  if (PH.name === 'tilt') lay = mixLay(PH.layFrom || LAY.nav, LAY.graph, prog(dt, 0, 1.5, easeIO));
  else if (PH.name === 'edges') lay = mixLay(PH.layFrom || LAY.graph, LAY.graph, prog(dt, 0, 0.6, easeIO));
  else if (PH.name === 'dij') lay = mixLay(PH.layFrom || LAY.graph, LAY.dij, prog(dt, 0, 0.9, easeIO));
  else if (PH.name === 'reveal') lay = LAY.dij;
  else lay = mixLay(PH.layFrom && PH.name === 'nav' ? PH.layFrom : LAY.nav, LAY.nav, prog(dt, 0, 0.6, easeIO));
  if (PH.name === 'dij' && !PH.intro) lay = LAY.dij;
  PL = Object.assign({}, lay);
  applyPlane();

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  baseTransform();
  switch (PH.name) {
    case 'intro': {
      drawHand(t - PH.t0 + (PH.intro ? 0 : 100), 1);
      break;
    }
    case 'nav': {
      const tn = t - PH.navT0;
      const show = navShow(tn);
      drawNavLayer(t, 1, show);
      navCard(show.card, show.card);
      modeChip(prog(tn, 0.6, 0.5));
      drawHand(100, 1 - prog(t - PH.t0, 0, 0.9, easeIO)); // 手绘地图淡出（换起终点时不再出现）
      break;
    }
    case 'tilt': {
      const fade = 1 - prog(dt, 0, 0.5), fade2 = 1 - prog(dt, 0.9, 0.6);
      drawNavLayer(t, 1, { labels: fade, pinS: 1, pinT: 1, pinA: fade2, route: 1, routeA: fade2, arrows: fade2 });
      navCard(fade, 1);
      const order = VS.map((v, i) => i).sort((a, b) => VS[a].xy[0] - VS[b].xy[0]);
      drawGraph(t, { vk: (i) => prog(dt, 1.1 + 0.09 * order.indexOf(i), 0.45), ek: () => 0, pk: () => 0, nameA: prog(dt, 1.9, 0.4) });
      caption('路口 → 顶点', prog(dt, 1.0, 0.5));
      break;
    }
    case 'edges': {
      drawGraph(t, { ek: (i) => prog(dt, 0.08 * i, 0.6, easeOut), pk: (i) => prog(dt, 0.45 + 0.08 * i, 0.4) });
      caption('路口 → 顶点', 1 - prog(dt, 0, 0.4));
      caption('路段 → 边，边上标长度（米）', prog(dt, 0.3, 0.5));
      break;
    }
    case 'dij': {
      const st = TR.states[PH.k], prevSt = PH.k > 0 ? TR.states[PH.k - 1] : null;
      const ldt = PH.intro && PH.k === 0 ? dt - 0.7 : dt;
      const shown = PH.intro && PH.k === 0 && dt < 0.7 ? null : st;
      drawGraph(t, { st: shown, prevSt, dt: ldt });
      drawTable(shown || TR.states[0], prevSt, ldt, prog(t - PH.dijT0, 0.15, 0.7, easeOut), shown ? {} : { final: true });
      caption('迪杰斯特拉：每次锁定 dist 最小的顶点', PH.intro && PH.k === 0 ? prog(dt, 0.2, 0.5) : 1, 640);
      if (PH.k === 0 && !(PH.intro && dt < 0.7)) text('初始化：起点放进 S，起点的邻居 dist = 边长', 640, 140, 30, COL.ink2, { weight: 500, halo: 8, alpha: PH.intro ? prog(dt, 0.9, 0.5) : 1 });
      else if (PH.k > 0) {
        const u = st.u; const dec = st.dec;
        let msg = `第 ${PH.k} 次：锁定 ${vShort(u)}（dist = ${st.dist[u]}）`;
        if (u === PAIR.t) msg = `第 ${PH.k} 次：锁定终点 ${vShort(u)}，结束`;
        text(msg, 640, 140, 32, u === PAIR.t ? COL.orangeDeep : COL.ink2, { weight: 600, halo: 8 });
        if (dec.length) {
          const d0 = dec[0];
          text(`${vShort(d0.v)}：${d0.old} → ${d0.nu}，找到更近的路了！`, 640, 190, 34, COL.red, { weight: 800, halo: 8, alpha: prog(ldt, 0.3, 0.4) });
        }
      }
      break;
    }
    case 'reveal': {
      const st = TR.states[TR.K];
      drawGraph(t, { st, dt: 99, final: true, reveal: dt, path: TR.path });
      const pathStr = TR.path.map(vShort).join(' → ');
      drawTable(st, null, 99, 1, { final: true, path: TR.path, reveal: prog(dt, 0.2, 0.6), summary: `${pathStr} = ${TR.dist} 米`, summaryA: prog(dt, 0.6, 0.5) });
      caption('迪杰斯特拉：每次锁定 dist 最小的顶点', 1 - prog(dt, 0, 0.4), 640);
      const tk = prog(dt, 1.9, 0.6, easeOut);
      bigLine([['导航给你的路线 ', COL.ink], ['=', COL.orange], [' 最短路径', COL.ink]], 74, 72, tk, tk);
      const tk2 = prog(dt, 2.4, 0.5, easeOut);
      bigLine([[`全程 ${TR.dist} 米`, COL.blue], ['  =  ', COL.ink3], [`dist[${VS[PAIR.t].short}] = ${TR.dist}`, COL.orangeDeep]], 156, 40, tk2, tk2, 640);
      break;
    }
  }
  if (DEBUG) VS.forEach((v, i) => { const p = vertexPos(i); ctx.save(); ctx.strokeStyle = '#FF00FF'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x - 14, p.y); ctx.lineTo(p.x + 14, p.y); ctx.moveTo(p.x, p.y - 14); ctx.lineTo(p.x, p.y + 14); ctx.stroke(); ctx.restore(); });
  drawToast(t); drawHints(); drawButtons(); drawCursor();
}
function loop() { if (!REC) render(); requestAnimationFrame(loop); }

// ---------------- 给测试 / 录屏用的接口 ----------------
window.__demo = {
  setTime(t) { manualT = t; render(); },
  render,
  state() { return { phase: PH.name, k: PH.k, K: TR.K, play: PH.play, paused: PH.paused, start: VS[PAIR.s].id, end: VS[PAIR.t].id, mode: PAIR.mode, dist: TR.dist }; },
  next, prev, fastForward, restart, jumpTo,
  setPair(s, t) { setPairTo(VI[s], VI[t]); },
  setMode(m) { PAIR.mode = m; },
  proj(x, y) { return proj(x, y); },
  clientOfStage(x, y) { return { x: VIEW.ox + x * VIEW.s, y: VIEW.oy + y * VIEW.s }; },
  labelHits() { return LABEL_HITS.map((h) => ({ vid: h.vid, x: h.x + h.w / 2, y: h.y + h.h / 2 })); },
  exportCheck() {
    const s = PAIR.s, t = PAIR.t;
    return {
      vertices: VS.map((v) => ({ id: v.id, letter: v.letter, bld: v.bld, xy: v.xy })),
      edges: ES.map((e) => ({ u: VS[e.a].id, v: VS[e.b].id, w: e.w })),
      start: VS[s].id, end: VS[t].id, K: TR.K,
      trace: TR.states.map((x) => ({ dist: x.dist.map((d) => (d >= INF ? null : d)), pred: x.pred.map((p) => (p < 0 ? null : VS[p].id)), locked: x.locked, u: VS[x.u].id, changed: x.changed.map((c) => VS[c].id), dec: x.dec.map((q) => ({ v: VS[q.v].id, old: q.old, nu: q.nu })), tie: x.tie })),
      navPath: TR.path.map((i) => VS[i].id), navDist: TR.dist, walkMin: walkMin(TR.dist), navPts: TR.pts,
      cardText: `全程 ${TR.dist} 米 · 步行约 ${walkMin(TR.dist)} 分钟`,
    };
  },
};
applyPlane();
window.__demoReady = false;
(function waitReady() { if (handReady || HAND.complete) { window.__demoReady = true; } else setTimeout(waitReady, 30); })();
requestAnimationFrame(loop);
</script>
