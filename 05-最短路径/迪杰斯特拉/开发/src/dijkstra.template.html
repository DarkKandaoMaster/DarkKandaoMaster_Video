<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>迪杰斯特拉算法：单源最短路径</title>
<style>
  html, body { margin: 0; height: 100%; background: #E9ECF0; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; display: block; outline: none; }
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<script>const NET = /*NETWORK*/null;</script>
<script>
'use strict';
/* =====================================================================
   迪杰斯特拉算法 · 正课（课堂版，单文件、离线、不配音，老师自己讲）。
   接在"导航演示"后面：开场的图和导航演示第 2 步结束时一模一样（同一组顶点坐标），再变成抽象的图。
   按 1920×1080 设计，按窗口大小等比缩放。全部手动，一按一步：
   1 承接   2 核心思想   3 三样东西（dist / path / S）   4 逐轮推进（历史表，每轮新增一列）
   5 读路径（最短路径树）   6 为什么锁定后不再变短（反证 + 负权反例）   7 课堂小练（换起点）
   8 算法框架和复杂度   9 小结
   ===================================================================== */

// ---------------- 配色与字体（和导航演示一致） ----------------
const COL = {
  bg: '#F4F6F8', ink: '#1F2430', ink2: '#555B6B', ink3: '#959AA6', line: '#E3E6EB',
  card: '#FFFFFF', cardLine: '#E5E8ED',
  orange: '#E8590C', orangeDeep: '#B5460A', orangeTint: '#FDE8DA', orangeSoft: '#FBE1CF',
  blue: '#2F7BF5', blueDeep: '#1A5FD1', green: '#1FAA59', greenDeep: '#137A3D', red: '#E5484D', redDeep: '#C9363B',
  edge: '#5B6472', edgeDim: '#9AA1AD',
};
const FONT_SANS = '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif';
const FONT_MONO = 'Consolas, "Microsoft YaHei", monospace';
const INF = 1e9;
const DEFAULT_START = 'G';        // 生命科学学院（和导航演示的默认起点一致）
const DEFAULT_PRACTICE = 'E';     // 课堂小练默认换成北门
const PRACTICE_SECONDS = 120;     // 小练限时

const QS = new URLSearchParams(location.search);
const REC = QS.has('record');     // 录屏 / 截图模式：手动时钟

// ---------------- 小工具 ----------------
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, start, dur, ease) => { const x = clamp01((t - start) / dur); return ease ? ease(x) : x; };
const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixHex = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return `rgb(${lerp(x[0], y[0], t) | 0},${lerp(x[1], y[1], t) | 0},${lerp(x[2], y[2], t) | 0})`; };
const fmtD = (d) => (d >= INF ? '∞' : String(d));

let manualT = 0;
const now = () => (REC ? manualT : performance.now() / 1000);

// ---------------- 画布与缩放 ----------------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VIEW = { s: 1, ox: 0, oy: 0, dpr: 1 };
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const s = Math.min(w / 1920, h / 1080);
  VIEW = { s, ox: (w - 1920 * s) / 2, oy: (h - 1080 * s) / 2, dpr };
}
window.addEventListener('resize', resize);
resize();
const baseTransform = () => ctx.setTransform(VIEW.dpr * VIEW.s, 0, 0, VIEW.dpr * VIEW.s, VIEW.dpr * VIEW.ox, VIEW.dpr * VIEW.oy);
const toStage = (e) => ({ x: (e.clientX - VIEW.ox) / VIEW.s, y: (e.clientY - VIEW.oy) / VIEW.s });

// =====================================================================
//  图：顶点 / 边（数据和导航演示同一份 network.json）
// =====================================================================
const VS = NET.vertices;
const N = VS.length;
const VI = {}; VS.forEach((v, i) => { VI[v.id] = i; });
const LI = {}; VS.forEach((v, i) => { LI[v.letter] = i; });
const L = (i) => VS[i].letter;
const ES = NET.edges.map((e) => ({ a: VI[e.u], b: VI[e.v], w: e.w, pts: e.pts }));
const ADJ = VS.map(() => []);
ES.forEach((e, k) => { ADJ[e.a].push({ to: e.b, w: e.w, e: k }); ADJ[e.b].push({ to: e.a, w: e.w, e: k }); });
ADJ.forEach((a) => a.sort((x, y) => L(x.to).localeCompare(L(y.to))));   // 邻居按字母顺序看
const BYLET = VS.map((v, i) => i).sort((a, b) => L(a).localeCompare(L(b)));
function edgeBetween(a, b) { for (const x of ADJ[a]) if (x.to === b) return x.e; return -1; }

// 导航演示第 2 步结束时（地图放倒、连好边）的镜头：同一套投影公式，算出每个顶点在 1920×1080 上的位置
const DEG = Math.PI / 180;
const NAVCAM = { k: 1.22, ox: 4205, oy: 1640, sx: 960, sy: 590, th: 40 * DEG, P: 1700, px: 960, py: 430 };
function projNav(wx, wy) {
  const C = NAVCAM;
  const dx = (wx - C.ox) * C.k, dy = (wy - C.oy) * C.k;
  const c = Math.cos(C.th), s = Math.sin(C.th);
  const x = C.sx + dx, y = C.sy + dy * c, z = dy * s;
  const f = C.P / (C.P - z);
  return { x: C.px + (x - C.px) * f, y: C.py + (y - C.py) * f };
}
const BASE = VS.map((v) => projNav(v.xy[0], v.xy[1]));
const BASE_E = ES.map((e) => e.pts.map((p) => projNav(p[0], p[1])));
const BASE_U = BASE_E.map((P) => { const c = [0]; for (let i = 1; i < P.length; i++) c.push(c[i - 1] + Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y)); return c.map((x) => x / c[c.length - 1]); });
const BC = (() => { const xs = BASE.map((p) => p.x), ys = BASE.map((p) => p.y); return { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: (Math.min(...ys) + Math.max(...ys)) / 2 }; })();
// 顶点旁边的标签往哪边放（单位方向）：避开连出去的边
const TAG_DIR = { A: [0, -1], B: [-0.5, 0.87], C: [0, -1], D: [0, 1], E: [1, 0], F: [0.45, -0.89], G: [1, 0], H: [0, -1] };
// 导航演示里起终点楼名的位置（屏幕像素偏移）
const NAME_OFF = { W: [-20, -62], LN: [-30, 62], X: [0, -64], L: [10, 64], N: [70, -30], M: [60, -52], J: [40, 62], C: [10, -64] };

// 图在各段的摆放：BASE 绕中心缩放 s 倍后放到 (cx, cy)；R 顶点半径，vf 顶点字号，wf 边长字号
const LAYS = {
  nav:   { s: 1,    cx: BC.x, cy: BC.y, R: 30, vf: 36, wf: 40 },
  title: { s: 0.86, cx: 960,  cy: 580,  R: 30, vf: 38, wf: 40 },
  round: { s: 0.6,  cx: 560,  cy: 262,  R: 27, vf: 36, wf: 36 },
  read:  { s: 0.76, cx: 660,  cy: 372,  R: 29, vf: 38, wf: 38 },
  proof: { s: 0.56, cx: 960,  cy: 318,  R: 27, vf: 36, wf: 36 },
  mid:   { s: 0.62, cx: 960,  cy: 352,  R: 27, vf: 36, wf: 36 },
};

// =====================================================================
//  迪杰斯特拉（照教材的朴素版，算到所有顶点都确定）
//  同距离时挑字母靠前的（这张图换哪个起点都不会出现同距离，核对脚本会检查）
// =====================================================================
function dijFull(s) {
  const dist = Array(N).fill(INF), path = Array(N).fill(-1), inS = Array(N).fill(false);
  dist[s] = 0; inS[s] = true;
  for (const { to, w } of ADJ[s]) { dist[to] = w; path[to] = s; }
  const snap = () => ({ dist: dist.slice(), path: path.slice(), S: inS.slice() });
  const states = [snap()], rounds = [], order = [s];
  for (;;) {
    const cand = BYLET.filter((v) => !inS[v] && dist[v] < INF);
    if (!cand.length) break;
    const m = Math.min(...cand.map((v) => dist[v]));
    const tied = cand.filter((v) => dist[v] === m);
    const u = tied[0];
    inS[u] = true; order.push(u);
    const ups = [], skipped = [];
    for (const { to, w } of ADJ[u]) {
      if (inS[to]) { skipped.push(to); continue; }
      const nd = dist[u] + w, changed = nd < dist[to];
      ups.push({ v: to, w, du: dist[u], nd, old: dist[to], changed });
      if (changed) { dist[to] = nd; path[to] = u; }
    }
    rounds.push({ u, du: dist[u], tied, ups, skipped });
    states.push(snap());
  }
  return { s, states, rounds, order, dist: dist.slice(), path: path.slice() };
}
function chainOf(tr, v) { const c = [v]; while (c[c.length - 1] !== tr.s) c.push(tr.path[c[c.length - 1]]); return c; } // v ← … ← 起点
function edgesOfChain(c) { const out = []; for (let i = 1; i < c.length; i++) out.push(edgeBetween(c[i - 1], c[i])); return out; }

// 当前起点（第 1 段可以点顶点换；第 7 段 Enter 用练习起点完整算一遍）与练习起点
const CUR = { s: LI[DEFAULT_START], ps: LI[DEFAULT_PRACTICE] };
let TR = null, PTR = null, STEPS = [], SEC_FIRST = {};
let READ = null, PROOF = null;

// 第 5 段：先演示哪两个点、再让学生读哪个点（跳数多的优先；32 号楼 C 优先；学生读的点不在已演示的路上）
function pickRead(tr) {
  const others = BYLET.filter((v) => v !== tr.s);
  const hops = (v) => chainOf(tr, v).length - 1;
  const sorted = others.slice().sort((a, b) => hops(b) - hops(a) || (L(a) === 'C' ? -1 : L(b) === 'C' ? 1 : 0) || L(a).localeCompare(L(b)));
  const demo = sorted.slice(0, 2);
  const onDemo = new Set(demo.flatMap((v) => chainOf(tr, v)));
  const quiz = sorted.slice(2).find((v) => !onDemo.has(v)) ?? sorted[2];
  return { demo, quiz };
}
// 第 6 段：取第 k 轮（S 里至少 3 个点、还有别的候选）刚锁定 B 的那一刻；X 优先挑和 B 直接相连的候选（假想的路就画在真边上），
// 没有就挑其余候选里 dist 最小的（假想的路画成虚线弧）
function pickProof(tr) {
  for (let k = 3; k <= tr.rounds.length; k++) {
    const st = tr.states[k - 1], B = tr.rounds[k - 1].u;
    const cand = BYLET.filter((v) => !st.S[v] && st.dist[v] < INF && v !== B).sort((a, b) => st.dist[a] - st.dist[b] || L(a).localeCompare(L(b)));
    const adj = cand.filter((v) => edgeBetween(v, B) >= 0), X = adj.length ? adj[0] : cand[0];
    if (cand.length) return { k, B, dB: st.dist[B], X, dX: st.dist[X], st };
  }
  return null;
}
function practiceInfo() {
  const tr = PTR, ps = tr.s, f = tr.rounds[0].u;
  const qt = L(ps) !== 'C' ? LI.C : LI.G;
  const ch = chainOf(tr, qt).slice().reverse();      // 起点 → … → qt
  const ws = []; for (let i = 1; i < ch.length; i++) ws.push(ES[edgeBetween(ch[i - 1], ch[i])].w);
  return { ps, f, df: tr.dist[f], qt, dq: tr.dist[qt], ch, ws };
}

// =====================================================================
//  步骤表（每按一下走一步）
// =====================================================================
const SEC_NAMES = ['承接', '核心思想', '三样东西', '逐轮推进', '读路径', '为什么对', '课堂小练', '框架与复杂度', '小结'];
function buildSteps() {
  TR = dijFull(CUR.s);
  if (CUR.ps === CUR.s) CUR.ps = L(CUR.s) !== DEFAULT_PRACTICE ? LI[DEFAULT_PRACTICE] : LI[DEFAULT_START];
  PTR = dijFull(CUR.ps);
  READ = pickRead(TR); PROOF = pickProof(TR);
  const S = [];
  const add = (o) => S.push(o);
  add({ sec: 1, kind: 'nav', lay: 'nav', st: 0 });
  add({ sec: 1, kind: 'title', lay: 'title' });
  add({ sec: 1, kind: 'all', lay: 'title' });
  for (let n = 1; n <= 3; n++) add({ sec: 2, kind: 'idea', n, lay: null });
  for (let n = 1; n <= 3; n++) add({ sec: 3, kind: 'three', n, lay: null });
  add({ sec: 4, kind: 'init', lay: 'round' });
  const R = TR.rounds.length;
  for (let i = 1; i <= R; i++) {
    add({ sec: 4, kind: 'q', i, lay: 'round' });
    add({ sec: 4, kind: 'l', i, lay: 'round' });
    if (i < R) add({ sec: 4, kind: 'u', i, lay: 'round' });
  }
  add({ sec: 5, kind: 'rfinal', lay: 'read' });
  add({ sec: 5, kind: 'read', v: READ.demo[0], lay: 'read' });
  add({ sec: 5, kind: 'read', v: READ.demo[1], lay: 'read' });
  add({ sec: 5, kind: 'quiz', v: READ.quiz, lay: 'read' });
  add({ sec: 5, kind: 'read', v: READ.quiz, quiz: true, lay: 'read' });
  add({ sec: 5, kind: 'tree', lay: 'read' });
  for (let n = 0; n <= 4; n++) add({ sec: 6, kind: 'proof', n, lay: 'proof' });
  add({ sec: 6, kind: 'neg', n: 0, lay: null });
  add({ sec: 6, kind: 'neg', n: 1, lay: null });
  for (let n = 0; n <= 2; n++) add({ sec: 7, kind: 'prac', n, lay: 'mid' });
  for (let n = 0; n <= 2; n++) add({ sec: 8, kind: 'code', n, lay: null });
  add({ sec: 9, kind: 'sum', lay: null });
  let last = 'nav';
  S.forEach((o) => { if (o.lay) { last = o.lay; o.g = 1; } else { o.lay = last; o.g = 0; } if (o.st === undefined) o.st = 1; });
  SEC_FIRST = {}; S.forEach((o, i) => { if (SEC_FIRST[o.sec] === undefined) SEC_FIRST[o.sec] = i; });
  STEPS = S;
}
buildSteps();

// ---------------- 播放状态 ----------------
const PH = { i: 0, t0: 0, lay: null, layFrom: null, layT0: -100, timerT0: 0 };
let LCUR = Object.assign({}, LAYS.nav, { g: 1, st: 0 });
const stepNow = () => STEPS[PH.i];
function targetLay(o) { return Object.assign({}, LAYS[o.lay], { g: o.g, st: o.st }); }
function goStep(i, instant) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  PH.i = i; PH.t0 = instant ? now() - 100 : now();
  PH.layFrom = instant ? null : Object.assign({}, LCUR); PH.layT0 = now();
  const o = STEPS[i];
  if (o.sec === 7 && o.n === 0) PH.timerT0 = now();
}
function stepDur(o) {
  if (o.kind === 'u') return 0.3 + 0.45 * Math.max(1, TR.rounds[o.i - 1].ups.length) + 1.2;
  if (o.kind === 'read') return 0.5 + 0.7 * (chainOf(TR, o.v).length - 1) + 0.8;
  if (o.kind === 'proof' || o.kind === 'init' || o.kind === 'tree') return 1.6;
  return 1.0;
}
function next() {
  const dt = now() - PH.t0;
  if (dt < stepDur(stepNow())) { PH.t0 = now() - 100; PH.layFrom = null; return; }   // 动画没放完：先放完
  if (PH.i < STEPS.length - 1) goStep(PH.i + 1);
}
function prev() { if (PH.i > 0) goStep(PH.i - 1, true); }
function jumpSec(n) { if (SEC_FIRST[n] !== undefined) goStep(SEC_FIRST[n]); }
function lastOfSec(sec) { let k = SEC_FIRST[sec]; while (k + 1 < STEPS.length && STEPS[k + 1].sec === sec) k++; return k; }
// R：恢复默认起点（G）和练习起点（E），回到本段开头
function restart() {
  const sec = stepNow().sec;
  CUR.s = LI[DEFAULT_START]; CUR.ps = LI[DEFAULT_PRACTICE]; buildSteps();
  goStep(SEC_FIRST[sec]);
}
// Enter：第 7 段 = 用练习起点完整算一遍（从第 4 段开始）；别处 = 跳到本段最后一步
function enter() {
  const o = stepNow();
  if (o.sec === 7) { runPractice(); return; }
  goStep(lastOfSec(o.sec));
}
function runPractice() {
  const ps = CUR.ps; CUR.s = ps; buildSteps();
  showToast(`起点换成 ${L(ps)}，从头算一遍`);
  goStep(SEC_FIRST[4]);
}
function setStart(v) {          // 第 1 段：点顶点换起点
  if (v === CUR.s) return;
  CUR.s = v; const sec = stepNow().sec, keep = PH.i - SEC_FIRST[sec]; buildSteps();
  goStep(SEC_FIRST[sec] + keep, true); PH.t0 = now();
  showToast(`起点换成 ${L(v)}`);
}
function setPractice(v) {       // 第 7 段：点顶点换练习起点，重新计时
  if (v === CUR.s) { showToast(`${L(v)} 是刚才讲的起点，换一个`); return; }
  CUR.ps = v; buildSteps(); goStep(SEC_FIRST[7]);
}

let toast = null;
function showToast(text) { toast = { text, t0: now() }; }

// =====================================================================
//  绘制工具
// =====================================================================
function setFont(size, weight, mono) { ctx.font = `${weight || 700} ${size}px ${mono ? FONT_MONO : FONT_SANS}`; }
function text(str, x, y, size, color, o) {
  o = o || {};
  setFont(size, o.weight, o.mono);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  if (o.halo) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.haloColor || 'rgba(244,246,248,0.95)'; ctx.lineWidth = o.halo; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function shadowCard(x, y, w, h, r, alpha) {
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.shadowColor = 'rgba(30,40,60,0.14)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 5;
  roundRect(x, y, w, h, r); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.restore();
}
// 一行多色文字：parts = [[文字, 颜色], …]；it = { p, x, y, size, align, mono, weight, delay }
function normParts(p) { return typeof p === 'string' ? [[p, COL.ink]] : p; }
function itemText(it) { return normParts(it.p).map((q) => q[0]).join(''); }
function measureParts(parts, size, weight, mono) { setFont(size, weight, mono); return parts.reduce((s, q) => s + ctx.measureText(q[0]).width, 0); }
function drawParts(parts, x, y, size, o) {
  o = o || {};
  const W = measureParts(parts, size, o.weight, o.mono);
  let x0 = o.align === 'left' ? x : o.align === 'right' ? x - W : x - W / 2;
  ctx.save(); ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  if (o.halo) {
    let xh = x0; ctx.lineJoin = 'round'; ctx.lineWidth = o.halo; ctx.strokeStyle = 'rgba(244,246,248,0.95)';
    for (const q of parts) { ctx.strokeText(q[0], xh, y); xh += ctx.measureText(q[0]).width; }
  }
  for (const q of parts) { ctx.fillStyle = q[1] || COL.ink; ctx.fillText(q[0], x0, y); x0 += ctx.measureText(q[0]).width; }
  ctx.restore();
  return W;
}
function drawItems(items, dt) {
  for (const it of items) {
    const a = it.delay === undefined ? 1 : prog(dt, it.delay, 0.45, easeOut);
    if (a <= 0.001) continue;
    ctx.save(); ctx.translate(0, (1 - a) * 14);
    drawParts(normParts(it.p), it.x, it.y, it.size, { align: it.align, mono: it.mono, weight: it.weight || 700, alpha: a, halo: it.halo });
    ctx.restore();
  }
}
// 折线
function polyLen(P) { let s = 0; for (let i = 1; i < P.length; i++) s += Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y); return s; }
function tracePoly(P, u) {
  const Lt = polyLen(P) * clamp01(u); let acc = 0;
  ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y);
  for (let i = 1; i < P.length; i++) {
    const d = Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y);
    if (acc + d >= Lt) { const f = d ? (Lt - acc) / d : 0; ctx.lineTo(lerp(P[i - 1].x, P[i].x, f), lerp(P[i - 1].y, P[i].y, f)); return; }
    ctx.lineTo(P[i].x, P[i].y); acc += d;
  }
}
function pointAt(P, u) {
  const Lt = polyLen(P) * clamp01(u); let acc = 0;
  for (let i = 1; i < P.length; i++) {
    const d = Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y);
    if (acc + d >= Lt) { const f = d ? (Lt - acc) / d : 0; return { x: lerp(P[i - 1].x, P[i].x, f), y: lerp(P[i - 1].y, P[i].y, f) }; }

  ctx.save(); roundRect(r.x, r.y, r.w, r.h, 26); ctx.fillStyle = hover ? '#FFFFFF' : 'rgba(255,255,255,0.85)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = hover ? COL.orange : COL.cardLine; ctx.stroke(); ctx.restore();
  text(`用 ${L(pi.ps)} 当起点，完整算一遍 ›`, r.x + r.w / 2, r.y + r.h / 2 + 1, 28, hover ? COL.orangeDeep : COL.ink2, { weight: 600 });
}
// 伪代码
const CODE = [
  [0, '初始化：S = {v0}，dist[v] = w(v0, v)，path[v] = v0'],
  [1, '（v 和 v0 不相邻：dist = ∞，path = −1）', 'gray'],
  [0, '重复 n − 1 次：'],
  [1, 'u = 不在 S 里、dist 最小的顶点'],
  [1, '把 u 加入 S'],
  [1, '对 u 的每个不在 S 里的邻居 v：'],
  [2, '如果 dist[u] + w(u, v) < dist[v]：'],
  [3, 'dist[v] = dist[u] + w(u, v)'],
  [3, 'path[v] = u'],
];
const CODE_NOTE = { 2: '← 共 n − 1 轮', 3: '← 找最小：O(n)', 5: '← 更新邻居：O(n)' };
function drawCode(o, dt) {
  const x0 = 210, y0 = 180, lh = 66;
  shadowCard(x0 - 40, y0 - 50, 1580, CODE.length * lh + 36, 24);
  CODE.forEach(([ind, s, g], j) => {
    const y = y0 + j * lh, hl = o.n >= 1 && (j === 3 || j === 5 || j === 2);
    if (hl) { ctx.save(); ctx.globalAlpha = prog(dt, o.n === 1 ? 0.1 + 0.25 * [2, 3, 5].indexOf(j) : 0, 0.3); roundRect(x0 - 24, y - lh / 2 + 6, 1000, lh - 12, 12); ctx.fillStyle = '#FFF3EA'; ctx.fill(); ctx.restore(); }
    text(s, x0 + ind * 72, y + 2, 42, g ? COL.ink3 : COL.ink, { align: 'left', mono: true, weight: g ? 600 : 700 });
    if (o.n >= 1 && CODE_NOTE[j]) text(CODE_NOTE[j], 1230, y + 2, 40, COL.orangeDeep, { align: 'left', weight: 800, alpha: prog(dt, o.n === 1 ? 0.1 + 0.25 * [2, 3, 5].indexOf(j) : 0, 0.3) });
  });
  if (o.n >= 2) {
    const a = prog(dt, 0.1, 0.45, easeOut);
    drawParts([['总时间：', COL.ink], ['(n − 1) × O(n) = ', COL.ink], ['O(n²)', COL.orange]], 960, 860, 60, { alpha: a, weight: 800 });
    text('（用小根堆找最小可以更快，课后了解）', 960, 950, 36, COL.ink3, { weight: 600, alpha: prog(dt, 0.6, 0.4) });
  }
}
function codeExport() { return CODE.map(([ind, s]) => '    '.repeat(ind) + s); }

// ---------------- 按钮、提示 ----------------
const BTN = { prev: { x: 1648, y: 1002, w: 76, h: 60 }, next: { x: 1736, y: 1002, w: 168, h: 60 }, prac: { x: 1300, y: 884, w: 470, h: 56 } };
const inRect = (p, r) => p && r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
let MOUSE = null, hintsOn = true;
try { hintsOn = localStorage.getItem('dij-hints') !== 'off'; } catch (e) { /* file:// 下可能不可用 */ }
function drawButtons() {
  const one = (r, label, enabled) => {
    const hover = inRect(MOUSE, r) && enabled;
    ctx.save(); ctx.globalAlpha = enabled ? 1 : 0.4;
    roundRect(r.x, r.y, r.w, r.h, 16); ctx.fillStyle = hover ? '#FFFFFF' : 'rgba(255,255,255,0.75)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = hover ? COL.ink3 : COL.cardLine; ctx.stroke(); ctx.restore();
    text(label, r.x + r.w / 2, r.y + r.h / 2 + 1, 30, hover ? COL.ink : COL.ink2, { weight: 600, alpha: enabled ? 1 : 0.4 });
  };
  one(BTN.prev, '‹', PH.i > 0);
  one(BTN.next, '下一步 ›', PH.i < STEPS.length - 1);
}
function drawHints() {
  if (!hintsOn) return;
  const o = stepNow(), k = PH.i - SEC_FIRST[o.sec] + 1, n = lastOfSec(o.sec) - SEC_FIRST[o.sec] + 1;
  text(`${o.sec} / 9  ${SEC_NAMES[o.sec - 1]}　·　${k} / ${n}`, 24, 1032, 22, COL.orange, { align: 'left', weight: 700 });
  let s = '点击 / 空格 / →：下一步　右键 / ←：上一步　1–9：跳段　Enter：本段结尾　R：重来　F：全屏　H：隐藏提示';
  if (o.sec === 1) s = '点顶点：换起点　点空白 / 空格 / →：下一步　← ：上一步　1–9：跳段　R：恢复起点 G　F：全屏　H：隐藏提示';
  if (o.sec === 7) s = '点顶点：换练习起点　Enter：用它完整算一遍　空格 / →：下一步　←：上一步　1–9：跳段　R：重来　H：隐藏提示';
  text(s, 1628, 1032, 22, COL.ink3, { align: 'right', weight: 400 });
}
function drawToast(t) {
  if (!toast) return; const a = 1 - prog(t, toast.t0 + 1.6, 0.4); if (a <= 0) { toast = null; return; }
  ctx.save(); ctx.globalAlpha = a; setFont(38, 600); const w = ctx.measureText(toast.text).width + 60;
  roundRect(960 - w / 2, 900, w, 70, 35); ctx.fillStyle = 'rgba(31,36,48,0.86)'; ctx.fill(); ctx.restore();
  text(toast.text, 960, 936, 38, '#FFFFFF', { alpha: a, weight: 600 });
}

// =====================================================================
//  每帧
// =====================================================================
function render() {
  const t = now(), o = stepNow(), dt = t - PH.t0;
  LCUR = curLay();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#E9ECF0'; ctx.fillRect(0, 0, cv.width, cv.height);
  baseTransform(); ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, 1920, 1080);
  switch (o.kind) {
    case 'nav': drawNavLook(dt); break;
    case 'title': case 'all': drawTitle(o, dt); break;
    case 'idea': case 'three': case 'code': case 'sum': case 'neg': drawGraph({}); break;   // 上一段的图淡出
    case 'init': case 'q': case 'l': case 'u': drawRound(o, dt); break;
    case 'rfinal': case 'read': case 'quiz': case 'tree': drawRead(o, dt); break;
    case 'proof': drawProof(o, dt); break;
    case 'prac': drawPractice(o, dt); break;
  }
  if (o.kind === 'neg') drawNeg(o, dt);
  if (o.kind === 'code') drawCode(o, dt);
  // 文字（读路径的倒推链按时间一跳一跳出现）
  const items = content(o);
  for (const it of items) {
    if (it.chain) {
      const parts = normParts(it.p), shown = [];
      parts.forEach((q, j) => { const hop = Math.floor((j + 1) / 2); if (hop === 0 || dt >= 0.5 + 0.7 * (hop - 1)) shown.push(q); });   // 第 h 跳在 0.5 + 0.7(h−1) 秒出现
      const all = it.p; it.p = shown; drawItems([Object.assign({}, it, { delay: undefined })], dt); it.p = all;
    } else drawItems([it], dt);
  }
  drawToast(t); drawHints(); drawButtons();
}
function loop() { if (!REC) render(); requestAnimationFrame(loop); }

// ---------------- 输入 ----------------
function vertexAt(p) {
  if (!p || LCUR.g < 0.5) return -1;
  for (let i = 0; i < N; i++) { const q = vpos(i); if (Math.hypot(p.x - q.x, p.y - q.y) <= LCUR.R + 14) return i; }
  return -1;
}
const canPickVertex = () => stepNow().sec === 1 || stepNow().sec === 7;
function hitButton(p) {
  if (inRect(p, BTN.next)) return 'next';
  if (inRect(p, BTN.prev)) return 'prev';
  if (stepNow().sec === 7 && inRect(p, BTN.prac)) return 'prac';
  return null;
}
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'Enter') { e.preventDefault(); enter(); }
  else if (k === 'r' || k === 'R') restart();
  else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } else document.exitFullscreen(); }
  else if (k === 'h' || k === 'H') { hintsOn = !hintsOn; try { localStorage.setItem('dij-hints', hintsOn ? 'on' : 'off'); } catch (e2) { /* 忽略 */ } }
  else if (/^[1-9]$/.test(k)) jumpSec(Number(k));
});
cv.addEventListener('mousemove', (e) => {
  MOUSE = toStage(e);
  cv.style.cursor = hitButton(MOUSE) || (canPickVertex() && vertexAt(MOUSE) >= 0) ? 'pointer' : 'default';
});
cv.addEventListener('mouseleave', () => { MOUSE = null; });
cv.addEventListener('click', (e) => {
  cv.focus();
  const p = toStage(e); MOUSE = p;
  const b = hitButton(p);
  if (b === 'next') { next(); return; }
  if (b === 'prev') { prev(); return; }
  if (b === 'prac') { runPractice(); return; }
  if (canPickVertex()) {
    const v = vertexAt(p);
    if (v >= 0) { if (stepNow().sec === 1) setStart(v); else setPractice(v); return; }
  }
  next();
});
cv.addEventListener('contextmenu', (e) => { e.preventDefault(); if (hitButton(toStage(e))) return; prev(); });

// ---------------- 给测试 / 录屏用的接口 ----------------
function stepDump() {
  const o = stepNow();
  const d = { idx: PH.i, sec: o.sec, kind: o.kind, i: o.i ?? null, n: o.n ?? null, v: o.v === undefined ? null : L(o.v), start: L(TR.s), texts: content(o).map(itemText) };
  if (['init', 'q', 'l', 'u'].includes(o.kind)) d.table = histExport(o);
  if (o.kind === 'code') d.code = codeExport();
  if (['rfinal', 'read', 'quiz', 'tree'].includes(o.kind)) d.final = histRows().map((v) => `${L(v)} ${TR.dist[v]} ${L(TR.path[v])}`);
  return d;
}
function exportCheck() {
  const lt = (arr) => { const o = {}; BYLET.forEach((v) => { o[L(v)] = arr[v]; }); return o; };
  const pi = practiceInfo();
  return {
    vertices: VS.map((v) => ({ id: v.id, letter: v.letter, xy: v.xy })), edges: ES.map((e) => ({ u: L(e.a), v: L(e.b), w: e.w })),
    start: L(TR.s), order: TR.order.map(L),
    states: TR.states.map((x) => ({ dist: lt(x.dist.map((d) => (d >= INF ? null : d))), path: lt(x.path.map((p) => (p < 0 ? null : L(p)))), S: BYLET.filter((v) => x.S[v]).map(L) })),
    rounds: TR.rounds.map((r) => ({ u: L(r.u), du: r.du, tied: r.tied.map(L), skipped: r.skipped.map(L), ups: r.ups.map((q) => ({ v: L(q.v), w: q.w, du: q.du, nd: q.nd, old: q.old >= INF ? null : q.old, changed: q.changed })) })),
    dist: lt(TR.dist), path: lt(TR.path.map((p) => (p < 0 ? null : L(p)))),
    chains: Object.fromEntries(BYLET.filter((v) => v !== TR.s).map((v) => [L(v), chainOf(TR, v).map(L).join(' ← ')])),
    read: { demo: READ.demo.map(L), quiz: L(READ.quiz) },
    proof: { k: PROOF.k, B: L(PROOF.B), dB: PROOF.dB, X: L(PROOF.X), dX: PROOF.dX, S: BYLET.filter((v) => PROOF.st.S[v]).map(L) },
    practice: { ps: L(pi.ps), first: L(pi.f), dfirst: pi.df, qt: L(pi.qt), dq: pi.dq, route: pi.ch.map(L), ws: pi.ws },
    steps: STEPS.length, secFirst: SEC_FIRST,
    basePos: Object.fromEntries(BYLET.map((v) => [L(v), [Math.round(BASE[v].x * 10) / 10, Math.round(BASE[v].y * 10) / 10]])),
  };
}
window.__demo = {
  setTime(t) { manualT = t; render(); },
  render,
  state() { const o = stepNow(); return { idx: PH.i, total: STEPS.length, sec: o.sec, kind: o.kind, i: o.i ?? null, n: o.n ?? null, start: L(TR.s), practice: L(CUR.ps), hints: hintsOn }; },
  next, prev, enter, restart, jumpSec, goStep(i) { goStep(i, true); },
  setStart(letter) { setStart(LI[letter]); }, setPractice(letter) { setPractice(LI[letter]); },
  clientOfStage(x, y) { return { x: VIEW.ox + x * VIEW.s, y: VIEW.oy + y * VIEW.s }; },
  vertexStage(letter) { const p = vpos(LI[letter]); return { x: p.x, y: p.y }; },
  stepDump, exportCheck,
  finishAnim() { PH.t0 = now() - 100; PH.layFrom = null; },
  isFullscreen() { return !!document.fullscreenElement; },
};
window.__demoReady = true;
requestAnimationFrame(loop);
</script>
