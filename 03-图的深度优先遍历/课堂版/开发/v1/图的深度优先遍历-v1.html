<script>const DATA = {"G4": {"n": 8, "edges": [[1, 2], [1, 3], [2, 4], [2, 5], [3, 6], [3, 7], [4, 8], [5, 8], [6, 7]], "pos": {"1": [560, 205], "2": [335, 415], "3": [785, 415], "4": [215, 635], "5": [455, 635], "6": [665, 635], "7": [905, 635], "8": [335, 855]}}, "G6": {"n": 6, "edges": [[1, 2], [1, 3], [2, 3], [4, 5]], "pos": {"1": [280, 420], "2": [150, 680], "3": [410, 680], "4": [600, 440], "5": [740, 700], "6": [905, 560]}}};</script>
<script>
'use strict';
/* =====================================================================
   图的深度优先遍历（DFS）· 正课（课堂版，单文件、离线、不配音，老师自己讲）
   按 1920×1080 设计，按窗口大小等比缩放。全部手动，一按一步。九段：
   1 走迷宫（3D）  2 两样工具  3 走一遍  4 序列不唯一  5 邻接表  6 非连通图
   7 算法与复杂度  8 课堂小练  9 小结（DFS 生成树，3D 提起来）
   3D 只用在第 1 段和第 9 段第 2 步；没有 WebGL / 显卡太慢 / 网址带 ?mode=2d 时自动用 2D 画法，内容和步数完全一样。
   做 BFS 时复制本文件：图数据、配色、文字绘制、播放器、面板（visited / 栈 / 序列）、3D 模块都能照用，
   换掉"算法"和"步骤表 + content() + 各段画面"三块即可。
   ===================================================================== */

// ---------------- 配色与字体（"图论·暖白"，和 B 站视频一致） ----------------
const COL = {
  bg: '#FAF7F0', dot: 'rgba(70, 60, 40, 0.085)', ink: '#1F2430', ink2: '#555B6B', ink3: '#959AA6',
  edge: '#CFC8BA', vStroke: '#2A2F3B', card: '#FFFFFF', cardLine: '#E5DED0', line: '#E5DED0',
  bad: '#E03131', badDeep: '#B02525',
  orange: '#E8590C', blue: '#1C7ED6', green: '#2B8A3E', purple: '#9C36B5',
  wallTop: '#E9DFCC', wallSide: '#CDBFA6', letterbox: '#E9E4DA',
};
const RUNC = [COL.orange, COL.blue, COL.green, COL.purple];     // 每一遍遍历一种颜色
const FONT_SANS = '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif';
const FONT_MONO = 'Consolas, "Microsoft YaHei", monospace';
const FONT_V = 'Cambria, "Times New Roman", serif';              // 斜体 v
const DEFAULT_PRACTICE = 6;        // 课堂小练默认起点 v6（v7 就在旁边，却是最后一个）
const PRACTICE_SECONDS = 120;      // 小练限时

const QS = new URLSearchParams(location.search);
const REC = QS.has('record');      // 录屏 / 截图模式：手动时钟

// ---------------- 小工具 ----------------
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, start, dur, ease) => { const x = clamp01((t - start) / dur); return ease ? ease(x) : x; };
const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixHex = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); const c = (i) => Math.round(lerp(x[i], y[i], t)).toString(16).padStart(2, '0'); return '#' + c(0) + c(1) + c(2); };
const tint = (c, k) => mixHex('#FFFFFF', c, k === undefined ? 0.18 : k);
const deep = (c, k) => mixHex(c, '#000000', k === undefined ? 0.22 : k);
const vn = (v) => 'v' + v;
const vlist = (a, sep) => a.map(vn).join(sep === undefined ? '、' : sep);

let manualT = 0;
const now = () => (REC ? manualT : performance.now() / 1000);

// ---------------- 画布与缩放 ----------------
const cv = document.getElementById('cv');
const glc = document.getElementById('gl');
const ctx = cv.getContext('2d');
let VIEW = { s: 1, ox: 0, oy: 0, dpr: 1 };
let BGIMG = null;
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const s = Math.min(w / 1920, h / 1080);
  VIEW = { s, ox: (w - 1920 * s) / 2, oy: (h - 1080 * s) / 2, dpr };
  glc.style.left = VIEW.ox + 'px'; glc.style.top = VIEW.oy + 'px'; glc.style.width = 1920 * s + 'px'; glc.style.height = 1080 * s + 'px';
  if (W3 && W3.ok) W3.r.setSize(Math.round(1920 * s * Math.min(dpr, 1.5)), Math.round(1080 * s * Math.min(dpr, 1.5)), false);
}
const baseTransform = () => ctx.setTransform(VIEW.dpr * VIEW.s, 0, 0, VIEW.dpr * VIEW.s, VIEW.dpr * VIEW.ox, VIEW.dpr * VIEW.oy);
const toStage = (e) => ({ x: (e.clientX - VIEW.ox) / VIEW.s, y: (e.clientY - VIEW.oy) / VIEW.s });
function makeBg() {        // 暖白底 + 淡点阵（画一次，之后整张贴）
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const g = c.getContext('2d');
  g.fillStyle = COL.bg; g.fillRect(0, 0, 1920, 1080); g.fillStyle = COL.dot;
  for (let y = 18; y < 1080; y += 36) for (let x = 18; x < 1920; x += 36) { g.beginPath(); g.arc(x, y, 1.4, 0, Math.PI * 2); g.fill(); }
  BGIMG = c;
}

// =====================================================================
//  图数据（build.py 从 data/graphs.json 内联）
// =====================================================================
function mkGraph(d) {
  const n = d.n, edges = d.edges.map((e) => [e[0], e[1]]);
  const nb = {}; for (let v = 1; v <= n; v++) nb[v] = [];
  edges.forEach(([a, b]) => { nb[a].push(b); nb[b].push(a); });
  const asc = {}, desc = {};
  for (let v = 1; v <= n; v++) { asc[v] = nb[v].slice().sort((x, y) => x - y); desc[v] = asc[v].slice().reverse(); }
  const pos = {}; for (let v = 1; v <= n; v++) pos[v] = { x: d.pos[v][0], y: d.pos[v][1] };
  return { n, edges, asc, desc, pos };
}
const G4 = mkGraph(DATA.G4), G6 = mkGraph(DATA.G6);
const hasEdge = (G, a, b) => G.asc[a].includes(b);

// =====================================================================
//  算法：教材的递归 DFS，记下画面要用的每一个事件

    drawParts([[str, left <= 10 ? COL.bad : COL.ink2]], 1860, 72, 56, { align: 'right', mono: left > 0, weight: 800 });
  }
}
// ---------------- 第 9 段：生成树 / 提起来 / 小结 ----------------
function drawTree2D(alpha) {
  const v = finalView(RUN_A);
  drawRunGraph(v, { G: G4, pos: vpos, R: LCUR.R, vf: LCUR.vf, c: COL.orange, treeSolid: true, dashNonTree: true, pointer: false, alpha });
}
function liftHud(P, dt) {
  // 每层一行字："第 k 层"（左边），顶点名字放在球上（平面层，不跟着透视变形）
  for (let d = 1; d <= TREE_HANG.maxD; d++) {
    const y = TREE_HANG.top - (d - 1) * TREE_HANG.dy, a = prog(dt, 2.0 + 0.1 * d, 0.4);
    const p = P(TREE_HANG.H[1].x - 3.5, y, TREE_HANG.H[1].z);
    drawParts([[`第 ${d} 层`, COL.ink2]], p.x, p.y, 36, { align: 'right', weight: 700, alpha: a, halo: 10 });
  }
  const deepSet = new Set(DEEP_A.chain);
  for (let v = 1; v <= G4.n; v++) { const q = liftPos(v, dt), p = P(q.x, q.y, q.z); vname(v, p.x, p.y + 1, 40, deepSet.has(v) ? '#FFFFFF' : deep(COL.orange, 0.12), 1); }
  // 右下：栈最深时的样子
  const a = prog(dt, 2.6, 0.4), x = 1600, w = 220, h = 62, bottom = 1010;
  if (a > 0.01) {
    drawParts([['栈最深时', COL.ink2]], x + w / 2, bottom - DEEP_A.d * (h + 6) - 34, 36, { alpha: a, halo: 10 });
    DEEP_A.chain.forEach((u, j) => { const y = bottom - (j + 1) * (h + 6); ctx.save(); ctx.globalAlpha = a; roundRect(x, y, w, h, 10); ctx.fillStyle = tint(COL.orange, 0.16); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.orange; ctx.stroke(); ctx.restore(); vname(u, x + w / 2, y + h / 2 + 1, 44, deep(COL.orange, 0.1), a); });
  }
}
function drawLift2D(dt) {           // 2D 画法：把 3D 的位置用一个固定的斜视投影摊到平面上
  const k0 = prog(dt, 0.1, 2.2, easeIO);
  const P = (x, y, z) => {
    const flat = { x: x * 100, y: z * 100 }, side = { x: 960 + (x - 5.6) * 168, y: 312 + (TREE_HANG.top - y) * 124 + (z - 5.3) * 24 };
    return { x: lerp(flat.x, side.x, k0), y: lerp(flat.y, side.y, k0) };
  };
  const Q = {}; for (let v = 1; v <= G4.n; v++) { const q = liftPos(v, dt); Q[v] = P(q.x, q.y, q.z); }
  // 地上的原图（淡）
  G4.edges.forEach(([a, b]) => line({ x: MZ.P[a].x * 100, y: MZ.P[a].z * 100 }, { x: MZ.P[b].x * 100, y: MZ.P[b].z * 100 }, 6, '#E6E0D4', 1 - k0));
  const deepSet = new Set(DEEP_A.chain);
  TREE_A.forEach(([a, b]) => line(Q[a], Q[b], 12, deepSet.has(a) && deepSet.has(b) ? COL.orange : tint(COL.orange, 0.55), 1));
  for (let v = 1; v <= G4.n; v++) { ctx.save(); ctx.beginPath(); ctx.arc(Q[v].x, Q[v].y, 46, 0, Math.PI * 2); ctx.fillStyle = deepSet.has(v) ? COL.orange : tint(COL.orange, 0.32); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = deep(COL.orange, 0.15); ctx.stroke(); ctx.restore(); }
  liftHud(P, dt);
}

// ---------------- 小提示（换起点等） ----------------
function drawToast(t) {
  if (!toast) return; const a = 1 - prog(t, toast.t0 + 1.8, 0.4); if (a <= 0) { toast = null; return; }
  ctx.save(); ctx.globalAlpha = a; ctx.font = fontOf(36, 600); const w = ctx.measureText(toast.text).width + 64;
  roundRect(960 - w / 2, 958, w, 68, 34); ctx.fillStyle = 'rgba(31,36,48,0.86)'; ctx.fill(); ctx.restore();
  drawParts([[toast.text, '#FFFFFF']], 960, 993, 36, { alpha: a, weight: 600 });
}
function drawIndicator() {         // 很小、很淡的"第几段 · 第几步"（右下角）
  const o = stepNow(), k = PH.i - SEC_FIRST[o.sec] + 1, n = lastOfSec(o.sec) - SEC_FIRST[o.sec] + 1;
  drawParts([[`${o.sec} · ${k}/${n}`, 'rgba(149,154,166,0.55)']], 1900, 1062, 20, { align: 'right', weight: 600 });
}

// =====================================================================
//  每帧
// =====================================================================
function render() {
  const t = now(), o = stepNow(), dt = t - PH.t0;
  LCUR = curLay();
  const d3 = use3D(o);
  glc.style.visibility = d3 ? 'visible' : 'hidden';
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = COL.letterbox; ctx.fillRect(0, 0, cv.width, cv.height);
  baseTransform();
  if (d3) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(Math.round(VIEW.ox * VIEW.dpr), Math.round(VIEW.oy * VIEW.dpr), Math.round(1920 * VIEW.s * VIEW.dpr), Math.round(1080 * VIEW.s * VIEW.dpr)); ctx.restore(); render3D(o, dt); }
  else ctx.drawImage(BGIMG, 0, 0, 1920, 1080);
  switch (o.kind) {
    case 'maze':
      if (d3) {
        mazeHud(mazeState(o.n, dt), proj3, dt, o);
        if (o.n < 4) { const g = ctx.createLinearGradient(0, 0, 0, 250); g.addColorStop(0, 'rgba(250,247,240,0.94)'); g.addColorStop(0.72, 'rgba(250,247,240,0.80)'); g.addColorStop(1, 'rgba(250,247,240,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 250); }
        if (o.n === 4) { const a = prog(dt, 1.55, 0.5); if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.drawImage(BGIMG, 0, 0, 1920, 1080); ctx.restore(); drawRunGraph(null, { G: G4, pos: vpos, R: LCUR.R, vf: LCUR.vf, c: COL.orange, alpha: a }); } }
      } else drawMaze2D(o, dt);
      break;
    case 'tools': case 'walk': case 'redo': drawWalkScene(o, dt); break;
    case 'adj': drawAdjScene(o, dt); break;
    case 'nc': drawNCScene(o, dt); break;
    case 'algo': drawAlgo(o, dt); break;
    case 'prac': drawPractice(o, dt); break;
    case 'end':
      if (o.n === 0) drawTree2D(1);
      else if (o.n === 1) {
        if (d3) { const a = 1 - prog(dt, 0, 0.35); if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.drawImage(BGIMG, 0, 0, 1920, 1080); ctx.restore(); drawTree2D(a); } liftHud(proj3, dt); }
        else drawLift2D(dt);
      }
      break;
  }
  drawItems(content(o), dt);
  drawToast(t); drawIndicator();
}
function loop() { if (!REC) render(); requestAnimationFrame(loop); }

// ---------------- 输入 ----------------
function vertexAt(p) {
  if (!p) return -1;
  for (let v = 1; v <= G4.n; v++) { const q = vpos(v); if (Math.hypot(p.x - q.x, p.y - q.y) <= LCUR.R + 16) return v; }
  return -1;
}
const canPickVertex = () => stepNow().kind === 'prac';
function toggle3D() {
  if (!W3.ok) { showToast('这台电脑用不了 3D，一直是 2D 画面'); return; }
  W3.on = !W3.on; W3.fpsChecked = true; showToast(W3.on ? '已切换为 3D 画面' : '已切换为 2D 画面');
  PH.layFrom = null; CAMB.from = null;
}
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'Enter') { e.preventDefault(); enter(); }
  else if (k === 'r' || k === 'R') restart();
  else if (k === 'd' || k === 'D') toggle3D();
  else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } else document.exitFullscreen(); }
  else if (/^[1-9]$/.test(k)) jumpSec(Number(k));
});
let MOUSE = null;
cv.addEventListener('mousemove', (e) => { MOUSE = toStage(e); cv.style.cursor = canPickVertex() && vertexAt(MOUSE) >= 0 ? 'pointer' : 'default'; });
cv.addEventListener('click', (e) => {
  cv.focus();
  const p = toStage(e);
  if (canPickVertex()) { const v = vertexAt(p); if (v >= 0) { setPractice(v); return; } }
  next();
});
cv.addEventListener('contextmenu', (e) => { e.preventDefault(); prev(); });

// =====================================================================
//  给测试 / 录屏用的接口
// =====================================================================
function viewOf(o) {   // 这一步放完以后的状态（导出给核对脚本）
  if (['tools', 'walk', 'redo'].includes(o.kind)) return walkView(o, 1e6);
  return null;
}
function stepDump() {
  const o = stepNow();
  const d = { idx: PH.i, sec: o.sec, kind: o.kind, n: o.n, texts: content(o).map((it) => partsText(it.p)) };
  const W = viewOf(o);
  if (W) {
    const s = W.view.snap;
    d.visited = s.visited.map((b) => (b ? 'T' : 'F')).join('');
    d.stack = s.stack.map(vn); d.seq = s.seq.map(vn);
    d.cur = s.stack.length ? vn(s.stack[s.stack.length - 1]) : null;
    d.vstate = Object.fromEntries(Array.from({ length: G4.n }, (_, i) => [vn(i + 1), s.stack.includes(i + 1) ? 'in' : s.visited[i] ? 'out' : 'un']));
    if (o.kind === 'redo') d.rows = [RUN_A.seq.map(vn), s.seq.map(vn)];
    if (o.kind === 'walk') d.wall = RUN_A.ev[o.a].t === 'visit' && !wallAfter(RUN_A, o.b).U.length;
  }
  if (o.kind === 'maze') { const ms = mazeState(o.n, 1e6); d.flags = Object.keys(ms.flags).filter((v) => ms.flags[v] > 0.5).map((v) => vn(+v)); d.walker = vn(o.n >= 3 ? 8 : o.n >= 1 ? 5 : 1); }
  if (o.kind === 'adj') { d.list = adjListExport(o.n === 2); d.rows = [RUN_A.seq.map(vn), RUN_D.seq.map(vn), o.n === 0 ? [] : RUN_A.seq.map(vn)]; d.revSeq = RUN_REV.seq.map(vn); }
  if (o.kind === 'nc') { d.calls = NC.map((r) => ({ start: vn(r.start), seq: r.seq.map(vn) })).slice(0, o.n === 0 ? 1 : NC.length); d.count = o.n === 0 ? 1 : NC.length; }
  if (o.kind === 'algo') { if (o.n === 0) d.code = CODE.map((c) => c[0] + (c[2] ? '  ' + c[2] : '')); else d.cx = { n: G4.n, e: G4.edges.length, matrix: G4.n * G4.n, list: G4.n + 2 * G4.edges.length }; }
  if (o.kind === 'prac') { d.start = vn(CUR.ps); if (o.n >= 1) d.seq = PR.seq.map(vn); if (o.n >= 2) d.deep = PRD.chain.map(vn); }
  if (o.kind === 'end') { d.tree = TREE_A.map(([a, b]) => vn(a) + '-' + vn(b)); d.depth = Object.fromEntries(Object.entries(DEPTH_A).map(([v, k]) => [vn(+v), k])); d.deep = DEEP_A.chain.map(vn); }
  return d;
}
function evOut(r) { return r.ev.map((e) => ({ t: e.t, v: e.v, frm: e.frm, stack: e.stack, visited: e.visited, seq: e.seq })); }
function exportCheck() {
  const pa = {};
  for (let s = 1; s <= G4.n; s++) { const p = practiceOf(s); pa[vn(s)] = { seq: p.run.seq.map(vn), depth: p.deep.d, deep: p.deep.chain.map(vn) }; }
  return {
    G4: { n: G4.n, edges: G4.edges }, G6: { n: G6.n, edges: G6.edges },
    runA: evOut(RUN_A), runD: evOut(RUN_D), runRev: evOut(RUN_REV), walk: WALK, allN: ALLN,
    adjlist: Array.from({ length: G4.n }, (_, i) => G4.asc[i + 1].map((w) => w - 1)),
    nc: NC.map((r) => ({ start: r.start, ev: evOut(r), seq: r.seq })),
    tree: TREE_A, depth: DEPTH_A, deep: DEEP_A, practice: pa, steps: STEPS.length, secFirst: SEC_FIRST,
  };
}
window.__demo = {
  setTime(t) { manualT = t; render(); },
  render,
  state() { const o = stepNow(); return { idx: PH.i, total: STEPS.length, sec: o.sec, kind: o.kind, n: o.n, dur: stepDur(o), practice: CUR.ps, mode: W3.on ? '3d' : '2d', can3d: W3.ok, reason: W3.reason }; },
  next, prev, enter, restart, jumpSec, toggle3D, goStep(i) { goStep(i, true); },
  setPractice(v) { setPractice(v); },
  clientOfStage(x, y) { return { x: VIEW.ox + x * VIEW.s, y: VIEW.oy + y * VIEW.s }; },
  vertexStage(v) { const p = vpos(v); return { x: p.x, y: p.y }; },
  stepDump, exportCheck,
  finishAnim() { PH.t0 = now() - 100; PH.layFrom = null; CAMB.from = null; },
  isFullscreen() { return !!document.fullscreenElement; },
};

makeBg(); init3D(); resize();
window.addEventListener('resize', resize);
LCUR = curLay();
window.__demoReady = true;
requestAnimationFrame(loop);
</script>
