<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图的深度优先遍历（DFS）</title>
<style>
  html, body { margin: 0; height: 100%; background: #E9E4DA; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; display: block; outline: none; }
  #gl { pointer-events: none; visibility: hidden; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv" tabindex="0"></canvas>
<script>/*THREE*/</script>
<script>const DATA = /*DATA*/null;</script>
<script>
'use strict';
/* =====================================================================
   图的深度优先遍历（DFS）· 正课（课堂版，单文件、离线、不配音，老师自己讲）
   按 1920×1080 设计，按窗口大小等比缩放。全部手动，一按一步。九段：
   1 走迷宫（3D）  2 两样工具  3 走一遍  4 序列不唯一  5 邻接表  6 非连通图
   7 算法与复杂度  8 课堂小练  9 小结（DFS 生成树，3D 提起来）
   3D 只用在第 1 段和第 9 段第 2 步；没有 WebGL / 显卡太慢 / 网址带 ?mode=2d 时自动用 2D 画法，内容和步数完全一样。
   做 BFS 时复制本文件：图数据、配色、文字绘制、播放器、面板（visited / 栈 / 序列）、3D 模块都能照用，
   换掉"算法"和"步骤表 + content() + 各段画面"三块即可。
   ===================================================================== */

// ---------------- 配色与字体（"图论·暖白"，和 B 站视频一致） ----------------
const COL = {
  bg: '#FAF7F0', dot: 'rgba(70, 60, 40, 0.085)', ink: '#1F2430', ink2: '#555B6B', ink3: '#959AA6',
  edge: '#CFC8BA', vStroke: '#2A2F3B', card: '#FFFFFF', cardLine: '#E5DED0', line: '#E5DED0',
  bad: '#E03131', badDeep: '#B02525',
  orange: '#E8590C', blue: '#1C7ED6', green: '#2B8A3E', purple: '#9C36B5',
  wallTop: '#E9DFCC', wallSide: '#CDBFA6', letterbox: '#E9E4DA',
};
const RUNC = [COL.orange, COL.blue, COL.green, COL.purple];     // 每一遍遍历一种颜色
const FONT_SANS = '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif';
const FONT_MONO = 'Consolas, "Microsoft YaHei", monospace';
const FONT_V = 'Cambria, "Times New Roman", serif';              // 斜体 v
const DEFAULT_PRACTICE = 6;        // 课堂小练默认起点 v6（v7 就在旁边，却是最后一个）
const PRACTICE_SECONDS = 120;      // 小练限时

const QS = new URLSearchParams(location.search);
const REC = QS.has('record');      // 录屏 / 截图模式：手动时钟

// ---------------- 小工具 ----------------
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, start, dur, ease) => { const x = clamp01((t - start) / dur); return ease ? ease(x) : x; };
const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixHex = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); const c = (i) => Math.round(lerp(x[i], y[i], t)).toString(16).padStart(2, '0'); return '#' + c(0) + c(1) + c(2); };
const tint = (c, k) => mixHex('#FFFFFF', c, k === undefined ? 0.18 : k);
const deep = (c, k) => mixHex(c, '#000000', k === undefined ? 0.22 : k);
const vn = (v) => 'v' + v;
const vlist = (a, sep) => a.map(vn).join(sep === undefined ? '、' : sep);

let manualT = 0;
const now = () => (REC ? manualT : performance.now() / 1000);

// ---------------- 画布与缩放 ----------------
const cv = document.getElementById('cv');
const glc = document.getElementById('gl');
const ctx = cv.getContext('2d');
let VIEW = { s: 1, ox: 0, oy: 0, dpr: 1 };
let BGIMG = null;
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const s = Math.min(w / 1920, h / 1080);
  VIEW = { s, ox: (w - 1920 * s) / 2, oy: (h - 1080 * s) / 2, dpr };
  glc.style.left = VIEW.ox + 'px'; glc.style.top = VIEW.oy + 'px'; glc.style.width = 1920 * s + 'px'; glc.style.height = 1080 * s + 'px';
  if (W3 && W3.ok) W3.r.setSize(Math.round(1920 * s * Math.min(dpr, 1.5)), Math.round(1080 * s * Math.min(dpr, 1.5)), false);
}
const baseTransform = () => ctx.setTransform(VIEW.dpr * VIEW.s, 0, 0, VIEW.dpr * VIEW.s, VIEW.dpr * VIEW.ox, VIEW.dpr * VIEW.oy);
const toStage = (e) => ({ x: (e.clientX - VIEW.ox) / VIEW.s, y: (e.clientY - VIEW.oy) / VIEW.s });
function makeBg() {        // 暖白底 + 淡点阵（画一次，之后整张贴）
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const g = c.getContext('2d');
  g.fillStyle = COL.bg; g.fillRect(0, 0, 1920, 1080); g.fillStyle = COL.dot;
  for (let y = 18; y < 1080; y += 36) for (let x = 18; x < 1920; x += 36) { g.beginPath(); g.arc(x, y, 1.4, 0, Math.PI * 2); g.fill(); }
  BGIMG = c;
}

// =====================================================================
//  图数据（build.py 从 data/graphs.json 内联）
// =====================================================================
function mkGraph(d) {
  const n = d.n, edges = d.edges.map((e) => [e[0], e[1]]);
  const nb = {}; for (let v = 1; v <= n; v++) nb[v] = [];
  edges.forEach(([a, b]) => { nb[a].push(b); nb[b].push(a); });
  const asc = {}, desc = {};
  for (let v = 1; v <= n; v++) { asc[v] = nb[v].slice().sort((x, y) => x - y); desc[v] = asc[v].slice().reverse(); }
  const pos = {}; for (let v = 1; v <= n; v++) pos[v] = { x: d.pos[v][0], y: d.pos[v][1] };
  return { n, edges, asc, desc, pos };
}
const G4 = mkGraph(DATA.G4), G6 = mkGraph(DATA.G6);
const hasEdge = (G, a, b) => G.asc[a].includes(b);

// =====================================================================
//  算法：教材的递归 DFS，记下画面要用的每一个事件
//  visit（入栈、visited 置 T、写进序列）/ check（看到已访问的邻接点，跳过）/ back（出栈，退回父顶点）/ done（起点出栈，栈空）
//  arc = 这个邻接点在 from 的邻接表里是第几个（0 起），给邻接表那一段画扫描框用
// =====================================================================
function dfsRun(G, order, start, visInit) {
  const vis = visInit ? visInit.slice() : Array(G.n).fill(false);
  const init = vis.slice();
  const stack = [], seq = [], ev = [], parent = {};
  const snap = () => ({ stack: stack.slice(), visited: vis.slice(), seq: seq.slice() });
  function dfs(v, from, arc) {
    vis[v - 1] = true; stack.push(v); seq.push(v); parent[v] = from;
    ev.push(Object.assign({ t: 'visit', v, frm: from, arc }, snap()));
    order[v].forEach((w, k) => {
      if (!vis[w - 1]) dfs(w, v, k);
      else ev.push(Object.assign({ t: 'check', v: w, frm: v, arc: k }, snap()));
    });
    stack.pop();
    if (from !== null) ev.push(Object.assign({ t: 'back', v, frm: from, arc: null }, snap()));
    else ev.push(Object.assign({ t: 'done', v, frm: null, arc: null }, snap()));
  }
  dfs(start, null, null);
  return { G, order, start, ev, seq, parent, empty: { stack: [], visited: init, seq: [] }, n: G.n };
}
// 一按一步的分组：每个 visit / back / done 开一个新步，紧跟着的 check 归到这一步
function groupsOf(ev) { const gs = []; ev.forEach((e, i) => { if (e.t === 'check' && gs.length) gs[gs.length - 1][1] = i; else gs.push([i, i]); }); return gs; }
function maxDepth(run) { let best = run.ev[0]; run.ev.forEach((e) => { if (e.stack.length > best.stack.length) best = e; }); return { d: best.stack.length, chain: best.stack.slice() }; }
function depthOf(run) { const d = {}; run.ev.forEach((e) => { if (e.t === 'visit') d[e.v] = e.stack.length; }); return d; }
function treeEdges(run) { return run.ev.filter((e) => e.t === 'visit' && e.frm !== null).map((e) => [e.frm, e.v]); }
// 从 start 出发的全部 DFS 序列个数（回溯枚举每一步的挑法）
function countAll(G, start) {
  const seen = new Set();
  (function go(stack, vis, seq) {
    while (stack.length && G.asc[stack[stack.length - 1]].every((w) => vis[w - 1])) stack = stack.slice(0, -1);
    if (!stack.length) { seen.add(seq.join(',')); return; }
    for (const w of G.asc[stack[stack.length - 1]]) if (!vis[w - 1]) { const v2 = vis.slice(); v2[w - 1] = true; go(stack.concat([w]), v2, seq.concat([w])); }
  })([start], G.asc ? Array(G.n).fill(false).map((x, i) => i === start - 1) : null, [start]);
  return seen.size;
}
// 非连通图：DFSTraverse（for v = 1..n，没访问过就调一次 DFS）
function traverse(G) {
  let vis = Array(G.n).fill(false); const calls = [];
  for (let v = 1; v <= G.n; v++) if (!vis[v - 1]) { const r = dfsRun(G, G.asc, v, vis); calls.push(r); vis = r.ev[r.ev.length - 1].visited.slice(); }
  return calls;
}

const RUN_A = dfsRun(G4, G4.asc, 1);            // 先挑编号小的（= 按邻接表）
const RUN_D = dfsRun(G4, G4.desc, 1);           // 先挑编号大的
const ADJ_REV = {}; for (let v = 1; v <= G4.n; v++) ADJ_REV[v] = G4.asc[v].slice().reverse();
const RUN_REV = dfsRun(G4, ADJ_REV, 1);         // 邻接表的链全部倒过来
const WALK = groupsOf(RUN_A.ev);
const ALLN = countAll(G4, 1);
const NC = traverse(G6);
const DEEP_A = maxDepth(RUN_A), DEPTH_A = depthOf(RUN_A), TREE_A = treeEdges(RUN_A);
const CUR = { ps: DEFAULT_PRACTICE };
let PR = null, PRD = null;
function practiceOf(ps) { const r = dfsRun(G4, G4.asc, ps); return { run: r, deep: maxDepth(r) }; }

// =====================================================================
//  步骤表（每按一下走一步）
// =====================================================================
const SEC_NAMES = ['走迷宫', '两样工具', '走一遍', '序列不唯一', '邻接表', '非连通图', '算法与复杂度', '课堂小练', '小结'];
let STEPS = [], SEC_FIRST = {};
function buildSteps() {
  const p = practiceOf(CUR.ps); PR = p.run; PRD = p.deep;
  const S = [], add = (o) => S.push(o);
  for (let n = 0; n <= 4; n++) add({ sec: 1, kind: 'maze', n, lay: n < 4 ? 'maze2d' : 'walk', d3: true });
  for (let n = 0; n <= 1; n++) add({ sec: 2, kind: 'tools', n, lay: 'walk' });
  WALK.forEach((g, k) => add({ sec: 3, kind: 'walk', n: k, a: g[0], b: g[1], lay: 'walk' }));
  for (let n = 0; n <= 2; n++) add({ sec: 4, kind: 'redo', n, lay: 'walk' });
  for (let n = 0; n <= 2; n++) add({ sec: 5, kind: 'adj', n, lay: 'adj' });
  for (let n = 0; n <= 2; n++) add({ sec: 6, kind: 'nc', n, lay: null });
  for (let n = 0; n <= 1; n++) add({ sec: 7, kind: 'algo', n, lay: null });
  for (let n = 0; n <= 2; n++) add({ sec: 8, kind: 'prac', n, lay: 'prac' });
  add({ sec: 9, kind: 'end', n: 0, lay: 'walk' });
  add({ sec: 9, kind: 'end', n: 1, lay: 'walk', d3: true });
  add({ sec: 9, kind: 'end', n: 2, lay: null });
  let last = 'maze2d';
  S.forEach((o) => { if (o.lay) last = o.lay; else o.lay = last; });
  SEC_FIRST = {}; S.forEach((o, i) => { if (SEC_FIRST[o.sec] === undefined) SEC_FIRST[o.sec] = i; });
  STEPS = S;
}
buildSteps();

// =====================================================================
//  事件时间表：一步里的事件一个接一个放（sp = 速度倍数，越小越快）
// =====================================================================
const EVD = { start: 0.45, visit: 0.8, back: 0.8, check: 0.6, done: 0.6 };
function schedule(ev, a, b, sp, t0) {
  const list = []; let t = t0 === undefined ? 0.15 : t0;
  for (let i = a; i <= b; i++) {
    const e = ev[i], key = e.t === 'visit' && e.frm === null ? 'start' : e.t;
    const d = EVD[key] * sp, land = (key === 'visit' ? 0.55 : 0.06) * sp;
    list.push({ i, t, d, land, key }); t += d;
  }
  return { list, end: t };
}
// 这一刻的画面状态：snap = 已经"落地"的最后一个事件之后的栈 / visited / 序列；外加正在放的动画
function runView(run, a, b, dt, sp, t0) {
  const S = schedule(run.ev, a, b, sp, t0);
  let si = a - 1; const v = { move: null, probe: null, push: null, pop: null, hold: null, doneK: null, checked: [] };
  for (const s of S.list) {
    const e = run.ev[s.i];
    if (dt >= s.t + s.land) si = s.i;
    if (e.t === 'check' && dt >= s.t + s.d * 0.45) v.checked.push(e.v);
    const u = (dt - s.t) / s.d;
    if (u < 0 || u >= 1) continue;
    if (s.key === 'visit') { const m = s.land / s.d; if (u < m) v.move = { from: e.frm, to: e.v, k: easeIO(u / m) }; else v.push = { v: e.v, k: (u - m) / (1 - m) }; }
    else if (s.key === 'start') v.push = { v: e.v, k: u };
    else if (s.key === 'back') { v.pop = { v: e.v, k: u, depth: e.stack.length }; const k = clamp01((u - 0.15) / 0.7); if (k <= 0) v.hold = e.v; else if (k < 1) v.move = { from: e.v, to: e.frm, k: easeIO(k) }; }
    else if (s.key === 'check') v.probe = { from: e.frm, to: e.v, k: Math.sin(Math.PI * u) };
    else if (s.key === 'done') { v.pop = { v: e.v, k: u, depth: 0 }; v.doneK = u; v.hold = e.v; }
  }
  v.snap = si >= 0 ? run.ev[si] : run.empty;
  v.end = S.end; v.run = run;
  return v;
}
const finalView = (run) => runView(run, 0, run.ev.length - 1, 1e6, 1);
const emptyView = (run) => runView(run, 0, -1, 0, 1);
function wallAfter(run, b) {   // 第 b 个事件之后：当前顶点（栈顶）还有没有没来过的邻接点
  const e = run.ev[b]; if (!e.stack.length) return { cur: null, U: [] };
  const cur = e.stack[e.stack.length - 1];
  return { cur, U: run.order[cur].filter((w) => !e.visited[w - 1]) };
}

// ---------------- 播放状态 ----------------
const PH = { i: 0, t0: 0, layFrom: null, layT0: -100, timerT0: 0 };
const stepNow = () => STEPS[PH.i];
function goStep(i, instant) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  const was3D = use3D(STEPS[PH.i]);
  PH.i = i; PH.t0 = instant ? now() - 100 : now();
  PH.layFrom = instant ? null : Object.assign({}, LCUR); PH.layT0 = now();
  camStepChange(instant || !was3D);
  const o = STEPS[i];
  if (o.kind === 'prac' && o.n === 0) PH.timerT0 = now();
}
function stepDur(o) {
  switch (o.kind) {
    case 'maze': return [1.0, MAZE_T1, 1.2, 2.0, 2.3][o.n];
    case 'walk': return schedule(RUN_A.ev, o.a, o.b, 1).end + 0.35;
    case 'redo': return o.n === 1 ? schedule(RUN_D.ev, 0, RUN_D.ev.length - 1, SP_FAST).end + 0.6 : 1.0;
    case 'adj': return o.n === 1 ? schedule(RUN_A.ev, 0, RUN_A.ev.length - 1, SP_FAST).end + 0.8 : 1.6;
    case 'nc': return o.n === 0 ? schedule(NC[0].ev, 0, NC[0].ev.length - 1, SP_FAST).end + 0.6 : o.n === 1 ? ncPlan().end + 0.4 : 1.2;
    case 'prac': return o.n === 1 ? schedule(PR.ev, 0, PR.ev.length - 1, SP_PRAC).end + 0.4 : 1.2;
    case 'end': return [1.4, 3.6, 1.6][o.n];
    case 'algo': return o.n === 0 ? 1.4 : 2.6;
    default: return 1.0;
  }
}
function next() {
  const dt = now() - PH.t0;
  if (dt < stepDur(stepNow())) { PH.t0 = now() - 100; PH.layFrom = null; camFinish(); return; }   // 动画没放完：先放完
  if (PH.i < STEPS.length - 1) goStep(PH.i + 1);
}
function prev() { if (PH.i > 0) goStep(PH.i - 1, true); }
function jumpSec(n) { if (SEC_FIRST[n] !== undefined) goStep(SEC_FIRST[n]); }
function lastOfSec(sec) { let k = SEC_FIRST[sec]; while (k + 1 < STEPS.length && STEPS[k + 1].sec === sec) k++; return k; }
function enter() { goStep(lastOfSec(stepNow().sec)); }                      // Enter：跳到本段最后一步
function restart() { CUR.ps = DEFAULT_PRACTICE; buildSteps(); goStep(SEC_FIRST[stepNow().sec]); }   // R：本段从头（小练起点恢复 v6）
function setPractice(v) {                                                   // 第 8 段：点顶点换起点，重新计时
  if (v === CUR.ps && stepNow().n === 0) return;
  CUR.ps = v; buildSteps(); goStep(SEC_FIRST[8]);
  showToast(`起点换成 v${v}`);
}
let toast = null;
function showToast(text) { toast = { text, t0: now() }; }

// =====================================================================
//  文字：v1 这种写法自动排成"斜体 v + 下标"
// =====================================================================
function fontOf(size, weight, mono) { return `${weight || 700} ${size}px ${mono ? FONT_MONO : FONT_SANS}`; }
const vFont = (size) => `italic 600 ${Math.round(size * 1.08)}px ${FONT_V}`;
const subFont = (size) => `700 ${Math.round(size * 0.62)}px ${FONT_SANS}`;
function segsOf(str, mono) {
  if (mono) return [{ s: str }];
  const out = [], re = /v(\d+)/g; let last = 0, m;
  while ((m = re.exec(str))) { if (m.index > last) out.push({ s: str.slice(last, m.index) }); out.push({ v: m[1] }); last = re.lastIndex; }
  if (last < str.length) out.push({ s: str.slice(last) });
  return out;
}
function segW(g, size, weight, mono) {
  if (g.s !== undefined) { ctx.font = fontOf(size, weight, mono); return ctx.measureText(g.s).width; }
  ctx.font = vFont(size); const a = ctx.measureText('v').width; ctx.font = subFont(size); return a + ctx.measureText(g.v).width + size * 0.06;
}
function segDraw(g, x, y, size, weight, mono, color, halo) {      // halo > 0：只描底边（第一遍）；否则只填字（第二遍）
  const strokeFill = (s, xx, yy) => { if (halo) { ctx.lineJoin = 'round'; ctx.lineWidth = halo; ctx.strokeStyle = 'rgba(250,247,240,0.96)'; ctx.strokeText(s, xx, yy); } else { ctx.fillStyle = color; ctx.fillText(s, xx, yy); } };
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  if (g.s !== undefined) { ctx.font = fontOf(size, weight, mono); strokeFill(g.s, x, y); return; }
  ctx.font = vFont(size); const a = ctx.measureText('v').width; strokeFill('v', x, y - size * 0.06);
  ctx.font = subFont(size); strokeFill(g.v, x + a + size * 0.03, y + size * 0.26);
}
function normParts(p) { return typeof p === 'string' ? [[p, COL.ink]] : p; }
function partsText(p) { return normParts(p).map((q) => q[0]).join(''); }
function measureParts(parts, size, weight, mono) { let w = 0; for (const q of parts) for (const g of segsOf(q[0], mono)) w += segW(g, size, weight, mono); return w; }
function drawParts(parts, x, y, size, o) {
  o = o || {}; parts = normParts(parts);
  const W = measureParts(parts, size, o.weight, o.mono);
  let x0 = o.align === 'left' ? x : o.align === 'right' ? x - W : x - W / 2;
  ctx.save(); ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  for (const pass of o.halo ? [o.halo, 0] : [0]) {
    let xx = x0;
    for (const q of parts) for (const g of segsOf(q[0], o.mono)) { segDraw(g, xx, y, size, o.weight, o.mono, q[1] || COL.ink, pass); xx += segW(g, size, o.weight, o.mono); }
  }
  ctx.restore();
  return W;
}
function drawItems(items, dt) {
  for (const it of items) {
    const a = it.delay === undefined ? 1 : prog(dt, it.delay, 0.45, easeOut);
    if (a <= 0.001) continue;
    ctx.save(); ctx.translate(0, (1 - a) * 14);
    drawParts(it.p, it.x, it.y, it.size, { align: it.align, mono: it.mono, weight: it.weight || 700, alpha: a * (it.alpha === undefined ? 1 : it.alpha), halo: it.halo });
    ctx.restore();
  }
}
function vname(v, x, y, size, color, alpha) { drawParts([['v' + v, color]], x, y, size, { alpha, weight: 700 }); }
function roundRect(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function card(x, y, w, h, r, alpha) {

  ['        if (!visited[v]) DFS(G, v);', 0, '← 非连通图：调几次就有几块'],
  ['}', 0],
  ['void DFS(Graph G, int v) {', 0],
  ['    visited[v] = TRUE; Visit(v);', 0, '← 工具一：插旗'],
  ['    for (w = FirstAdjVex(G, v); w >= 0; w = NextAdjVex(G, v, w))', 0],
  ['        if (!visited[w]) DFS(G, w);', 0, '← 递归：系统替你压栈'],
  ['}', 0],
];
const CX_TEXT = [
  { p: [['邻接矩阵', COL.orange]], x: 520, y: 200, size: 48, weight: 800, delay: 0.1 },
  { p: '找一个顶点的邻接点：扫一整行', x: 520, y: 690, size: 40, delay: 0.5 },
  { p: [['n 个顶点 × 每行 n 格 = ', COL.ink], ['O(n²)', COL.orange]], x: 520, y: 760, size: 48, weight: 800, delay: 0.9 },
  { p: [[`G4：${G4.n} × ${G4.n} = ${G4.n * G4.n} 格`, COL.ink2]], x: 520, y: 840, size: 40, delay: 1.2 },
  { p: [['邻接表', COL.green]], x: 1400, y: 200, size: 48, weight: 800, delay: 0.1 },
  { p: '找一个顶点的邻接点：扫它那条链', x: 1400, y: 690, size: 40, delay: 0.5 },
  { p: [['n 个顶点 + 2e 个边结点 = ', COL.ink], ['O(n + e)', COL.green]], x: 1400, y: 760, size: 48, weight: 800, delay: 0.9 },
  { p: [[`G4：${G4.n} + ${2 * G4.edges.length} = ${G4.n + 2 * G4.edges.length} 个`, COL.ink2]], x: 1400, y: 840, size: 40, delay: 1.2 },
];
function drawAlgo(o, dt) {
  if (o.n === 0) {
    const x0 = 170, y0 = 196, lh = 72;
    card(x0 - 40, y0 - 52, 1660, CODE.length * lh + 40, 24, prog(dt, 0, 0.3));
    CODE.forEach(([s, , note], j) => {
      const y = y0 + j * lh, a = prog(dt, 0.05 * j, 0.3);
      if (note) { ctx.save(); ctx.globalAlpha = prog(dt, 0.7, 0.4) * 0.9; roundRect(x0 - 20, y - lh / 2 + 8, 820, lh - 16, 10); ctx.fillStyle = tint(COL.orange, 0.14); ctx.fill(); ctx.restore(); }
      drawParts([[s, COL.ink]], x0, y + 2, 40, { align: 'left', mono: true, alpha: a });
      if (note) drawParts([[note, COL.orange]], 1020, y + 2, 40, { align: 'left', weight: 800, alpha: prog(dt, 0.8, 0.4) });
    });
    return;
  }
  card(110, 140, 820, 760, 24); card(990, 140, 820, 760, 24);
  // 邻接矩阵：8×8 小方阵，高亮条一行一行扫
  const n = G4.n, cs = 46, mx = 520 - n * cs / 2, my = 250;
  const row = Math.floor(clamp01((dt - 0.3) / 2.0) * n - 1e-9);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const on = hasEdge(G4, i + 1, j + 1), x = mx + j * cs, y = my + i * cs;
    ctx.fillStyle = i === row && dt < 2.4 ? tint(COL.orange, 0.3) : '#FFFFFF'; ctx.fillRect(x, y, cs, cs);
    if (on) { ctx.fillStyle = COL.orange; roundRect(x + 9, y + 9, cs - 18, cs - 18, 5); ctx.fill(); }
    ctx.lineWidth = 1.5; ctx.strokeStyle = COL.cardLine; ctx.strokeRect(x, y, cs, cs);
  }
  // 邻接表：n 个顶点格 + 2e 个结点，一个一个亮
  const lx = 1180, ly = 250, rh = 46;
  let cnt = 0; const total = n + 2 * G4.edges.length, kk = clamp01((dt - 0.3) / 2.0) * total;
  for (let v = 1; v <= n; v++) {
    const y = ly + (v - 1) * rh; const a = cnt < kk ? 1 : 0; cnt++;
    ctx.fillStyle = a ? tint(COL.green, 0.35) : '#FFFFFF'; ctx.fillRect(lx, y + 6, 70, rh - 12); ctx.lineWidth = 2; ctx.strokeStyle = COL.ink2; ctx.strokeRect(lx, y + 6, 70, rh - 12);
    G4.asc[v].forEach((w, j) => { const x = lx + 110 + j * 100, b = cnt < kk ? 1 : 0; cnt++; line({ x: x - 34, y: y + rh / 2 }, { x: x - 6, y: y + rh / 2 }, 2, COL.ink3, 1); ctx.fillStyle = b ? COL.green : '#FFFFFF'; ctx.fillRect(x, y + 8, 64, rh - 16); ctx.strokeStyle = COL.ink2; ctx.strokeRect(x, y + 8, 64, rh - 16); });
  }
}
// ---------------- 第 8 段：课堂小练 ----------------
function drawPractice(o, dt) {
  const ps = CUR.ps, c = COL.orange;
  const v = o.n === 0 ? emptyView(PR) : o.n === 1 ? runView(PR, 0, PR.ev.length - 1, dt, SP_PRAC) : finalView(PR);
  const chain = new Set(PRD.chain);
  const deepE = new Set(); for (let i = 1; i < PRD.chain.length; i++) deepE.add(PRD.chain[i - 1] + '-' + PRD.chain[i]);
  drawRunGraph(v, {
    G: G4, pos: vpos, R: LCUR.R, vf: LCUR.vf, c, start: ps, pointer: o.n === 1,
    ring: (u) => (u === ps && o.n === 0 ? { ring: COL.green } : null),
  });
  if (o.n === 2) for (let i = 1; i < PRD.chain.length; i++) line(vpos(PRD.chain[i - 1]), vpos(PRD.chain[i]), 11, c, 1);
  if (o.n === 2) for (const u of PRD.chain) drawVertexAt(u, vpos(u), LCUR.R, LCUR.vf, vstyle('in', c), 1);
  { const p = vpos(ps); drawParts([['起点', COL.green]], p.x, p.y - LCUR.R - 34, 36, { weight: 800, halo: 8 }); }
  if (o.n >= 1) drawSeqRows([{ label: '', c, seq: v.snap.seq, newK: v.push ? v.push.k : null }], { at: { x: 1000, y: 380 }, title: false });
  if (o.n >= 2) {   // 栈最深那一刻（横着画：左边栈底、右边栈顶）
    const x0 = 1000, y0 = 720, w = 76, h = 66, a = prog(dt, 0.4, 0.4);
    PRD.chain.forEach((u, j) => { ctx.save(); ctx.globalAlpha = a; roundRect(x0 + j * (w + 6), y0, w, h, 10); ctx.fillStyle = tint(c, 0.16); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = c; ctx.stroke(); ctx.restore(); vname(u, x0 + j * (w + 6) + w / 2, y0 + h / 2 + 1, 44, deep(c, 0.1), a); });
    drawParts([['栈底', COL.ink2]], x0 + w / 2, y0 + h + 32, 36, { alpha: a });
    drawParts([['栈顶', COL.ink2]], x0 + (PRD.chain.length - 1) * (w + 6) + w / 2, y0 + h + 32, 36, { alpha: a });
  }
  if (o.n === 0) {                 // 倒计时
    const left = Math.max(0, PRACTICE_SECONDS - (now() - PH.timerT0));
    const sec = Math.ceil(left), str = left <= 0 ? '时间到' : `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    drawParts([[str, left <= 10 ? COL.bad : COL.ink2]], 1860, 72, 56, { align: 'right', mono: left > 0, weight: 800 });
  }
}
// ---------------- 第 9 段：生成树 / 提起来 / 小结 ----------------
function drawTree2D(alpha) {
  const v = finalView(RUN_A);
  drawRunGraph(v, { G: G4, pos: vpos, R: LCUR.R, vf: LCUR.vf, c: COL.orange, treeSolid: true, dashNonTree: true, pointer: false, alpha });
}
function liftHud(P, dt) {
  // 每层一行字："第 k 层"（左边），顶点名字放在球上（平面层，不跟着透视变形）
  for (let d = 1; d <= TREE_HANG.maxD; d++) {
    const y = TREE_HANG.top - (d - 1) * TREE_HANG.dy, a = prog(dt, 2.0 + 0.1 * d, 0.4);
    const p = P(TREE_HANG.H[1].x - 3.5, y, TREE_HANG.H[1].z);
    drawParts([[`第 ${d} 层`, COL.ink2]], p.x, p.y, 36, { align: 'right', weight: 700, alpha: a, halo: 10 });
  }
  const deepSet = new Set(DEEP_A.chain);
  for (let v = 1; v <= G4.n; v++) { const q = liftPos(v, dt), p = P(q.x, q.y, q.z); vname(v, p.x, p.y + 1, 40, deepSet.has(v) ? '#FFFFFF' : deep(COL.orange, 0.12), 1); }
  // 右下：栈最深时的样子
  const a = prog(dt, 2.6, 0.4), x = 1600, w = 220, h = 62, bottom = 1010;
  if (a > 0.01) {
    drawParts([['栈最深时', COL.ink2]], x + w / 2, bottom - DEEP_A.d * (h + 6) - 34, 36, { alpha: a, halo: 10 });
    DEEP_A.chain.forEach((u, j) => { const y = bottom - (j + 1) * (h + 6); ctx.save(); ctx.globalAlpha = a; roundRect(x, y, w, h, 10); ctx.fillStyle = tint(COL.orange, 0.16); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.orange; ctx.stroke(); ctx.restore(); vname(u, x + w / 2, y + h / 2 + 1, 44, deep(COL.orange, 0.1), a); });
  }
}
function drawLift2D(dt) {           // 2D 画法：把 3D 的位置用一个固定的斜视投影摊到平面上
  const k0 = prog(dt, 0.1, 2.2, easeIO);
  const P = (x, y, z) => {
    const flat = { x: x * 100, y: z * 100 }, side = { x: 960 + (x - 5.6) * 168, y: 312 + (TREE_HANG.top - y) * 124 + (z - 5.3) * 24 };
    return { x: lerp(flat.x, side.x, k0), y: lerp(flat.y, side.y, k0) };
  };
  const Q = {}; for (let v = 1; v <= G4.n; v++) { const q = liftPos(v, dt); Q[v] = P(q.x, q.y, q.z); }
  // 地上的原图（淡）
  G4.edges.forEach(([a, b]) => line({ x: MZ.P[a].x * 100, y: MZ.P[a].z * 100 }, { x: MZ.P[b].x * 100, y: MZ.P[b].z * 100 }, 6, '#E6E0D4', 1 - k0));
  const deepSet = new Set(DEEP_A.chain);
  TREE_A.forEach(([a, b]) => line(Q[a], Q[b], 12, deepSet.has(a) && deepSet.has(b) ? COL.orange : tint(COL.orange, 0.55), 1));
  for (let v = 1; v <= G4.n; v++) { ctx.save(); ctx.beginPath(); ctx.arc(Q[v].x, Q[v].y, 46, 0, Math.PI * 2); ctx.fillStyle = deepSet.has(v) ? COL.orange : tint(COL.orange, 0.32); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = deep(COL.orange, 0.15); ctx.stroke(); ctx.restore(); }
  liftHud(P, dt);
}

// ---------------- 小提示（换起点等） ----------------
function drawToast(t) {
  if (!toast) return; const a = 1 - prog(t, toast.t0 + 1.8, 0.4); if (a <= 0) { toast = null; return; }
  ctx.save(); ctx.globalAlpha = a; ctx.font = fontOf(36, 600); const w = ctx.measureText(toast.text).width + 64;
  roundRect(960 - w / 2, 958, w, 68, 34); ctx.fillStyle = 'rgba(31,36,48,0.86)'; ctx.fill(); ctx.restore();
  drawParts([[toast.text, '#FFFFFF']], 960, 993, 36, { alpha: a, weight: 600 });
}
function drawIndicator() {         // 很小、很淡的"第几段 · 第几步"（右下角）
  const o = stepNow(), k = PH.i - SEC_FIRST[o.sec] + 1, n = lastOfSec(o.sec) - SEC_FIRST[o.sec] + 1;
  drawParts([[`${o.sec} · ${k}/${n}`, 'rgba(149,154,166,0.55)']], 1900, 1062, 20, { align: 'right', weight: 600 });
}

// =====================================================================
//  每帧
// =====================================================================
function render() {
  const t = now(), o = stepNow(), dt = t - PH.t0;
  LCUR = curLay();
  const d3 = use3D(o);
  glc.style.visibility = d3 ? 'visible' : 'hidden';
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = COL.letterbox; ctx.fillRect(0, 0, cv.width, cv.height);
  baseTransform();
  if (d3) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(Math.round(VIEW.ox * VIEW.dpr), Math.round(VIEW.oy * VIEW.dpr), Math.round(1920 * VIEW.s * VIEW.dpr), Math.round(1080 * VIEW.s * VIEW.dpr)); ctx.restore(); render3D(o, dt); }
  else ctx.drawImage(BGIMG, 0, 0, 1920, 1080);
  switch (o.kind) {
    case 'maze':
      if (d3) {
        mazeHud(mazeState(o.n, dt), proj3, dt, o);
        if (o.n < 4) { const g = ctx.createLinearGradient(0, 0, 0, 250); g.addColorStop(0, 'rgba(250,247,240,0.94)'); g.addColorStop(0.72, 'rgba(250,247,240,0.80)'); g.addColorStop(1, 'rgba(250,247,240,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 250); }
        if (o.n === 4) { const a = prog(dt, 1.55, 0.5); if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.drawImage(BGIMG, 0, 0, 1920, 1080); ctx.restore(); drawRunGraph(null, { G: G4, pos: vpos, R: LCUR.R, vf: LCUR.vf, c: COL.orange, alpha: a }); } }
      } else drawMaze2D(o, dt);
      break;
    case 'tools': case 'walk': case 'redo': drawWalkScene(o, dt); break;
    case 'adj': drawAdjScene(o, dt); break;
    case 'nc': drawNCScene(o, dt); break;
    case 'algo': drawAlgo(o, dt); break;
    case 'prac': drawPractice(o, dt); break;
    case 'end':
      if (o.n === 0) drawTree2D(1);
      else if (o.n === 1) {
        if (d3) { const a = 1 - prog(dt, 0, 0.35); if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.drawImage(BGIMG, 0, 0, 1920, 1080); ctx.restore(); drawTree2D(a); } liftHud(proj3, dt); }
        else drawLift2D(dt);

  }

}
function loop() { if (!REC) render(); requestAnimationFrame(loop); }

// ---------------- 输入 ----------------
function vertexAt(p) {
  if (!p) return -1;
  for (let v = 1; v <= G4.n; v++) { const q = vpos(v); if (Math.hypot(p.x - q.x, p.y - q.y) <= LCUR.R + 16) return v; }
  return -1;
}
const canPickVertex = () => stepNow().kind === 'prac';
function toggle3D() {
  if (!W3.ok) { showToast('这台电脑用不了 3D，一直是 2D 画面'); return; }
  W3.on = !W3.on; W3.fpsChecked = true; showToast(W3.on ? '已切换为 3D 画面' : '已切换为 2D 画面');
  PH.layFrom = null; CAMB.from = null;
}
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'Enter') { e.preventDefault(); enter(); }
  else if (k === 'r' || k === 'R') restart();
  else if (k === 'd' || k === 'D') toggle3D();
  else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } else document.exitFullscreen(); }
  else if (/^[1-9]$/.test(k)) jumpSec(Number(k));
});
let MOUSE = null;
cv.addEventListener('mousemove', (e) => { MOUSE = toStage(e); cv.style.cursor = canPickVertex() && vertexAt(MOUSE) >= 0 ? 'pointer' : 'default'; });
cv.addEventListener('click', (e) => {
  cv.focus();
  const p = toStage(e);
  if (canPickVertex()) { const v = vertexAt(p); if (v >= 0) { setPractice(v); return; } }
  next();
});
cv.addEventListener('contextmenu', (e) => { e.preventDefault(); prev(); });

// =====================================================================
//  给测试 / 录屏用的接口
// =====================================================================
function viewOf(o) {   // 这一步放完以后的状态（导出给核对脚本）
  if (['tools', 'walk', 'redo'].includes(o.kind)) return walkView(o, 1e6);
  return null;
}
function stepDump() {
  const o = stepNow();
  const d = { idx: PH.i, sec: o.sec, kind: o.kind, n: o.n, texts: content(o).map((it) => partsText(it.p)) };
  const W = viewOf(o);
  if (W) {
    const s = W.view.snap;

    d.stack = s.stack.map(vn); d.seq = s.seq.map(vn);
    d.cur = s.stack.length ? vn(s.stack[s.stack.length - 1]) : null;
    d.vstate = Object.fromEntries(Array.from({ length: G4.n }, (_, i) => [vn(i + 1), s.stack.includes(i + 1) ? 'in' : s.visited[i] ? 'out' : 'un']));
    if (o.kind === 'redo') d.rows = [RUN_A.seq.map(vn), s.seq.map(vn)];
    if (o.kind === 'walk') d.wall = RUN_A.ev[o.a].t === 'visit' && !wallAfter(RUN_A, o.b).U.length;
  }
  if (o.kind === 'maze') { const ms = mazeState(o.n, 1e6); d.flags = Object.keys(ms.flags).filter((v) => ms.flags[v] > 0.5).map((v) => vn(+v)); d.walker = vn(o.n >= 3 ? 8 : o.n >= 1 ? 5 : 1); }
  if (o.kind === 'adj') { d.list = adjListExport(o.n === 2); d.rows = [RUN_A.seq.map(vn), RUN_D.seq.map(vn), o.n === 0 ? [] : RUN_A.seq.map(vn)]; d.revSeq = RUN_REV.seq.map(vn); }
  if (o.kind === 'nc') { d.calls = NC.map((r) => ({ start: vn(r.start), seq: r.seq.map(vn) })).slice(0, o.n === 0 ? 1 : NC.length); d.count = o.n === 0 ? 1 : NC.length; }
  if (o.kind === 'algo') { if (o.n === 0) d.code = CODE.map((c) => c[0] + (c[2] ? '  ' + c[2] : '')); else d.cx = { n: G4.n, e: G4.edges.length, matrix: G4.n * G4.n, list: G4.n + 2 * G4.edges.length }; }
  if (o.kind === 'prac') { d.start = vn(CUR.ps); if (o.n >= 1) d.seq = PR.seq.map(vn); if (o.n >= 2) d.deep = PRD.chain.map(vn); }
  if (o.kind === 'end') { d.tree = TREE_A.map(([a, b]) => vn(a) + '-' + vn(b)); d.depth = Object.fromEntries(Object.entries(DEPTH_A).map(([v, k]) => [vn(+v), k])); d.deep = DEEP_A.chain.map(vn); }
  return d;
}
function evOut(r) { return r.ev.map((e) => ({ t: e.t, v: e.v, frm: e.frm, stack: e.stack, visited: e.visited, seq: e.seq })); }
function exportCheck() {
  const pa = {};
  for (let s = 1; s <= G4.n; s++) { const p = practiceOf(s); pa[vn(s)] = { seq: p.run.seq.map(vn), depth: p.deep.d, deep: p.deep.chain.map(vn) }; }
  return {
    G4: { n: G4.n, edges: G4.edges }, G6: { n: G6.n, edges: G6.edges },
    runA: evOut(RUN_A), runD: evOut(RUN_D), runRev: evOut(RUN_REV), walk: WALK, allN: ALLN,
    adjlist: Array.from({ length: G4.n }, (_, i) => G4.asc[i + 1].map((w) => w - 1)),
    nc: NC.map((r) => ({ start: r.start, ev: evOut(r), seq: r.seq })),
    tree: TREE_A, depth: DEPTH_A, deep: DEEP_A, practice: pa, steps: STEPS.length, secFirst: SEC_FIRST,
  };
}
window.__demo = {
  setTime(t) { manualT = t; render(); },
  render,
  state() { const o = stepNow(); return { idx: PH.i, total: STEPS.length, sec: o.sec, kind: o.kind, n: o.n, dur: stepDur(o), practice: CUR.ps, mode: W3.on ? '3d' : '2d', can3d: W3.ok, reason: W3.reason }; },
  next, prev, enter, restart, jumpSec, toggle3D, goStep(i) { goStep(i, true); },
  setPractice(v) { setPractice(v); },
  clientOfStage(x, y) { return { x: VIEW.ox + x * VIEW.s, y: VIEW.oy + y * VIEW.s }; },
  vertexStage(v) { const p = vpos(v); return { x: p.x, y: p.y }; },
  stepDump, exportCheck,
  finishAnim() { PH.t0 = now() - 100; PH.layFrom = null; CAMB.from = null; },
  isFullscreen() { return !!document.fullscreenElement; },
};

makeBg(); init3D(); resize();
window.addEventListener('resize', resize);
LCUR = curLay();
window.__demoReady = true;
requestAnimationFrame(loop);
