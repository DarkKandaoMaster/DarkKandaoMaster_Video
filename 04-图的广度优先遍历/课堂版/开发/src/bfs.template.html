<script>const DATA = /*DATA*/null;</script>
<script>
'use strict';
/* =====================================================================
   图的广度优先遍历（BFS）· 正课（课堂版，DFS 课堂版第二版的姊妹篇；单文件、离线、不配音，老师自己讲）
   按 1920×1080 设计，按窗口大小等比缩放。全部手动，一按一步；一步只出一样新东西，字只留标题 + 最多一行。九段：
   1 水波（3D）  2 两样工具（3D 棋盘）  3 走一遍（3D 棋盘）  4 入队就标记（3D 棋盘）  5 序列唯一吗（3D 棋盘 + 邻接表）
   6 层号 = 最短边数（3D 提起来）  7 非连通图（3D 小岛）与算法  8 课堂小练  9 小结（DFS / BFS 并排）
   没有 WebGL / 显卡太慢 / 网址带 ?mode=2d 时自动用 2D 画法，内容和步数完全一样。
   框架（播放器、缩放、文字、面板、3D 棋盘、自动降级、测试接口）照搬 DFS 课堂版第二版，算法和各段画面换成 BFS。
   ===================================================================== */

// ---------------- 配色与字体（"图论·暖白"，和 DFS 课堂版、B 站视频一致） ----------------
const COL = {
  bg: '#FAF7F0', dot: 'rgba(70, 60, 40, 0.085)', ink: '#1F2430', ink2: '#555B6B', ink3: '#959AA6',
  edge: '#CFC8BA', vStroke: '#2A2F3B', card: '#FFFFFF', cardLine: '#E5DED0', line: '#E5DED0',
  bad: '#E03131', badDeep: '#B02525',
  orange: '#E8590C', blue: '#1C7ED6', green: '#2B8A3E', purple: '#9C36B5',
  letterbox: '#E9E4DA', slab: '#EFE6D5',
  water: '#DCEAF3', waterRim: '#A9CBE3', ripple: '#1C7ED6', stone: '#8A8F99',
};
const RUNC = [COL.orange, COL.blue, COL.green, COL.purple];     // 每一遍遍历一种颜色
const FONT_SANS = '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif';
const FONT_MONO = 'Consolas, "Microsoft YaHei", monospace';
const FONT_V = 'Cambria, "Times New Roman", serif';              // 斜体 v
const DEFAULT_PRACTICE = 6;        // 课堂小练默认起点 v6（v7 就在旁边，v8 却要 5 条边；和 DFS 课堂版同一个起点）
const PRACTICE_SECONDS = 120;      // 小练限时

const QS = new URLSearchParams(location.search);
const REC = QS.has('record');      // 录屏 / 截图模式：手动时钟

// ---------------- 小工具 ----------------
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t;
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, start, dur, ease) => { const x = clamp01((t - start) / dur); return ease ? ease(x) : x; };
const hex2rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixHex = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); const c = (i) => Math.round(lerp(x[i], y[i], t)).toString(16).padStart(2, '0'); return '#' + c(0) + c(1) + c(2); };
const tint = (c, k) => mixHex('#FFFFFF', c, k === undefined ? 0.18 : k);
const deep = (c, k) => mixHex(c, '#000000', k === undefined ? 0.22 : k);
const vn = (v) => 'v' + v;
const vlist = (a, sep) => a.map(vn).join(sep === undefined ? '、' : sep);
const sameArr = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

let manualT = 0;
const now = () => (REC ? manualT : performance.now() / 1000);

// ---------------- 画布与缩放 ----------------
const cv = document.getElementById('cv');
const glc = document.getElementById('gl');
const ctx = cv.getContext('2d');
let VIEW = { s: 1, ox: 0, oy: 0, dpr: 1 };
let BGIMG = null;
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const s = Math.min(w / 1920, h / 1080);
  VIEW = { s, ox: (w - 1920 * s) / 2, oy: (h - 1080 * s) / 2, dpr };
  glc.style.left = VIEW.ox + 'px'; glc.style.top = VIEW.oy + 'px'; glc.style.width = 1920 * s + 'px'; glc.style.height = 1080 * s + 'px';
  if (W3 && W3.ok) W3.r.setSize(Math.round(1920 * s * Math.min(dpr, 1.5)), Math.round(1080 * s * Math.min(dpr, 1.5)), false);
}
const baseTransform = () => ctx.setTransform(VIEW.dpr * VIEW.s, 0, 0, VIEW.dpr * VIEW.s, VIEW.dpr * VIEW.ox, VIEW.dpr * VIEW.oy);
const toStage = (e) => ({ x: (e.clientX - VIEW.ox) / VIEW.s, y: (e.clientY - VIEW.oy) / VIEW.s });
function makeBg() {        // 暖白底 + 淡点阵（画一次，之后整张贴）
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const g = c.getContext('2d');
  g.fillStyle = COL.bg; g.fillRect(0, 0, 1920, 1080); g.fillStyle = COL.dot;
  for (let y = 18; y < 1080; y += 36) for (let x = 18; x < 1920; x += 36) { g.beginPath(); g.arc(x, y, 1.4, 0, Math.PI * 2); g.fill(); }
  BGIMG = c;
}

// =====================================================================
//  图数据（build.py 从 data/graphs.json 内联）
// =====================================================================
function mkGraph(d) {
  const n = d.n, edges = d.edges.map((e) => [e[0], e[1]]);
  const nb = {}; for (let v = 1; v <= n; v++) nb[v] = [];
  edges.forEach(([a, b]) => { nb[a].push(b); nb[b].push(a); });
  const asc = {}, desc = {};
  for (let v = 1; v <= n; v++) { asc[v] = nb[v].slice().sort((x, y) => x - y); desc[v] = asc[v].slice().reverse(); }
  const pos = {}; for (let v = 1; v <= n; v++) pos[v] = { x: d.pos[v][0], y: d.pos[v][1] };
  return { n, edges, asc, desc, pos };
}
const G4 = mkGraph(DATA.G4), G6 = mkGraph(DATA.G6);
const hasEdge = (G, a, b) => G.asc[a].includes(b);

// =====================================================================
//  算法：教材算法 7.6 的 BFS（入队时就置 visited），记下画面要用的每一个事件
//  visit（起点：置 T、访问、入队）/ deq（队头出队，成为"当前顶点"；prev = 出队前小人站在哪）
//  / enq（邻接点没来过：置 T、访问、入队）/ check（邻接点来过了，跳过；inq = 它此刻还在队里）/ done（队空，结束）
//  每个事件带事件之后的 queue / visited / seq / cur 快照；arc = 这个邻接点在 from 的邻接表里是第几个（0 起）
// =====================================================================
function bfsRun(G, order, start, visInit) {
  const vis = visInit ? visInit.slice() : Array(G.n).fill(false);
  const init = vis.slice();
  const Q = [], seq = [], ev = [], parent = {}, layer = {};
  let h = 0, cur = null, where = start;
  const snap = () => ({ queue: Q.slice(h), visited: vis.slice(), seq: seq.slice(), cur });
  vis[start - 1] = true; Q.push(start); seq.push(start); layer[start] = 0;
  ev.push(Object.assign({ t: 'visit', v: start, frm: null, arc: null, prev: null }, snap()));
  while (h < Q.length) {
    const u = Q[h]; h++; cur = u;
    ev.push(Object.assign({ t: 'deq', v: u, frm: null, arc: null, prev: where }, snap()));
    where = u;
    order[u].forEach((w, k) => {
      if (!vis[w - 1]) { vis[w - 1] = true; Q.push(w); seq.push(w); parent[w] = u; layer[w] = layer[u] + 1; ev.push(Object.assign({ t: 'enq', v: w, frm: u, arc: k, prev: null }, snap())); }
      else ev.push(Object.assign({ t: 'check', v: w, frm: u, arc: k, prev: null, inq: Q.slice(h).includes(w) }, snap()));
    });
  }
  cur = null;
  ev.push(Object.assign({ t: 'done', v: start, frm: null, arc: null, prev: null }, snap()));
  return { G, order, start, ev, seq, parent, layer, empty: { queue: [], visited: init, seq: [], cur: null }, n: G.n };
}
// 一按一步的分组：每个 visit / deq / done 开一个新组，紧跟着的 enq / check 归到这一组
function groupsOf(ev) { const gs = []; ev.forEach((e, i) => { if ((e.t === 'check' || e.t === 'enq') && gs.length) gs[gs.length - 1][1] = i; else gs.push([i, i]); }); return gs; }
function layersOf(run) { const L = []; run.seq.forEach((v) => { const k = run.layer[v]; (L[k] = L[k] || []).push(v); }); return L; }
function treeEdges(run) { return run.ev.filter((e) => e.t === 'enq').map((e) => [e.frm, e.v]); }
function pathTo(run, v) { const p = [v]; while (run.parent[p[0]] !== undefined) p.unshift(run.parent[p[0]]); return p; }
// 小人站在哪：出过队就站在最近出队的顶点；还没出过队（刚从起点出发）就站在起点；队空了就没有
function walkerAt(run, snap) { return snap.cur !== null ? snap.cur : snap.queue.length && snap.seq.length === 1 ? run.start : null; }
// 从 start 出发的全部 BFS 序列个数（出队一个时，它没来过的邻接点可以按任意顺序入队，逐个枚举）
function countAll(G, start) {
  const seen = new Set();
  const perms = (a) => (a.length <= 1 ? [a] : a.flatMap((x, i) => perms(a.slice(0, i).concat(a.slice(i + 1))).map((p) => [x].concat(p))));
  (function go(q, vis, seq) {
    if (!q.length) { seen.add(seq.join(',')); return; }
    const u = q[0], rest = q.slice(1), nw = G.asc[u].filter((w) => !vis.has(w));
    for (const p of perms(nw)) { const v2 = new Set(vis); p.forEach((w) => v2.add(w)); go(rest.concat(p), v2, seq.concat(p)); }
  })([start], new Set([start]), [start]);
  return seen.size;
}
// 非连通图：BFSTraverse（for v = 1..n，没访问过就从 v 出发 BFS 一次）
function traverse(G) {
  let vis = Array(G.n).fill(false); const calls = [];
  for (let v = 1; v <= G.n; v++) if (!vis[v - 1]) { const r = bfsRun(G, G.asc, v, vis); calls.push(r); vis = r.ev[r.ev.length - 1].visited.slice(); }
  return calls;
}
// 反例：等出队才标记（错的写法）。记下每个顶点出队处理完后的队列和标记
function markOnDeq(G, order, start) {
  const marked = Array(G.n).fill(false), Q = [start], log = []; let h = 0;
  while (h < Q.length) {
    const u = Q[h]; h++;
    if (marked[u - 1]) { log.push({ u, skip: true, push: [], queue: Q.slice(h), marked: marked.slice() }); continue; }
    marked[u - 1] = true; const push = [];
    for (const w of order[u]) if (!marked[w - 1]) { push.push(w); Q.push(w); }
    log.push({ u, skip: false, push, queue: Q.slice(h), marked: marked.slice() });
  }
  return { log, pushes: Q.slice() };
}
// 对比用：DFS（先挑编号小的）生成树，深度 0 起
function dfsTree(G, order, start) {
  const vis = Array(G.n).fill(false), parent = {}, depth = {}, seq = [];
  (function go(v, d) { vis[v - 1] = true; depth[v] = d; seq.push(v); order[v].forEach((w) => { if (!vis[w - 1]) { parent[w] = v; go(w, d + 1); } }); })(start, 0);
  return { parent, depth, seq, maxD: Math.max(...Object.values(depth)) };
}

const RUN_A = bfsRun(G4, G4.asc, 1);            // 先挑编号小的（= 按邻接表）
const RUN_D = bfsRun(G4, G4.desc, 1);           // 先挑编号大的
const ADJ_REV = {}; for (let v = 1; v <= G4.n; v++) ADJ_REV[v] = G4.asc[v].slice().reverse();
const RUN_REV = bfsRun(G4, ADJ_REV, 1);         // 邻接表的链全部倒过来
const LAYERS_A = layersOf(RUN_A), LAYER_A = RUN_A.layer, MAXL = LAYERS_A.length - 1;
const LAYER_L = LAYERS_A.reduce((b, L, k) => (L.length > LAYERS_A[b].length ? k : b), 0);   // 最大的一层（第 2 层）：队里正好是它时停下来问
const LAYERS_D = layersOf(RUN_D);
// 第 3 段一按一步：起点一步；每出队一个顶点拆成"vX 出队"和"vX 的邻接点"两步；
// v1 的邻接点入队后插一步"下一个出队的是谁？"；队里正好是第 2 层时插"现在队里是第几层？""正好是第 2 层"；队空一步；最后"序列按层排好"
function walkSteps(run) {
  const out = []; let nDeq = 0;
  groupsOf(run.ev).forEach(([a, b], g) => {
    const e = run.ev[a];
    if (e.t === 'visit') out.push({ mode: 'start', a, b: a, g });
    else if (e.t === 'deq') {
      out.push({ mode: 'deq', a, b: a, g });
      out.push({ mode: 'look', a: a + 1, b, g, first: nDeq === 0 });
      if (nDeq === 0) out.push({ mode: 'askNext', a: b + 1, b, g });
      if (sameArr(run.ev[b].queue, LAYERS_A[LAYER_L])) { out.push({ mode: 'askLayer', a: b + 1, b, g }); out.push({ mode: 'layer', a: b + 1, b, g }); }
      nDeq++;
    } else out.push({ mode: 'done', a, b, g });
  });
  out.push({ mode: 'layers', a: run.ev.length, b: run.ev.length - 1, g: -1 });
  return out;
}
const stateIdx = (w) => Math.max(w.b, w.a - 1);     // 这一步放完以后的状态 = 第几个事件之后
const WALK = groupsOf(RUN_A.ev);
const WALK2 = walkSteps(RUN_A);
const ALLN = countAll(G4, 1);
const NC = traverse(G6);
const NC_COMP = NC.map((r) => r.seq.slice());
const BTREE = treeEdges(RUN_A);
const FAR_A = LAYERS_A[MAXL], PATH_A = pathTo(RUN_A, FAR_A[0]);            // v8：第 3 层，v1 → v2 → v4 → v8
const DFS_A = dfsTree(G4, G4.asc, 1), DFS_L = DFS_A.maxD + 1;                 // DFS 树 5 层
const DCHAIN = (() => { let v = +Object.keys(DFS_A.depth).find((k) => DFS_A.depth[k] === DFS_A.maxD); const p = [v]; while (DFS_A.parent[p[0]] !== undefined) p.unshift(DFS_A.parent[p[0]]); return p; })();
// 第 4 段：v5 出队时看 v8（v8 还在队里、已经插了旗）
const MARK_I = RUN_A.ev.findIndex((e) => e.t === 'check' && e.inq);
const MARK_U = RUN_A.ev[MARK_I].frm, MARK_W = RUN_A.ev[MARK_I].v;
const MARK_G = WALK.find(([a, b]) => a <= MARK_I && MARK_I <= b);           // v5 出队那一组 [deq, …, 最后一个 check]
const MARK_END = MARK_G[1];
const WRONG = markOnDeq(G4, G4.asc, 1);
const WR_AT = WRONG.log.find((l) => l.u === MARK_U && !l.skip);             // 错法：v5 出队处理完 → 队列 v6 v7 v8 v8
const WR_BEFORE = WR_AT.queue.slice(0, WR_AT.queue.length - WR_AT.push.length);
const WR_DUP = WR_AT.push.find((x) => WR_AT.queue.filter((y) => y === x).length >= 2);
const WR_UNMARK = RUN_A.ev[MARK_END].queue.filter((v) => !WR_AT.marked[v - 1]);   // 错法里这时还没插旗的：v6 v7 v8
// 第 5 段第 3 步："v3 先出队 → 它的邻接点先入队"
const D_FIRST = LAYERS_D[1][0];
const ARCS = LAYERS_D[1].map((u) => ({ u, kids: RUN_D.ev.filter((e) => e.t === 'enq' && e.frm === u).map((e) => e.v) }));
const CUR = { ps: DEFAULT_PRACTICE };
let PR = null, PRA = null;
function practiceOf(ps) {
  const r = bfsRun(G4, G4.asc, ps), L = layersOf(r), far = L[L.length - 1];
  return { run: r, layers: L, maxL: L.length - 1, far, path: pathTo(r, far[0]) };
}

// ---------------- 第 1 段水波的位置：顶点摆在以 v1 为圆心的同心圆上，半径 = 层号 × 一圈 ----------------
const PC = { x: 6.0, z: 5.0 }, RING_R = 1.45, POND_RAD = 4.95;
const PONDP = {}, TEXTP = {};
for (let v = 1; v <= G4.n; v++) {
  const a = DATA.G4.pondAngle[v] * Math.PI / 180, r = LAYER_A[v] * RING_R;
  PONDP[v] = { x: PC.x + r * Math.cos(a), z: PC.z + r * Math.sin(a) };
  TEXTP[v] = { x: G4.pos[v].x / 100, z: G4.pos[v].y / 100 };
}
const pondPos = (v, k) => ({ x: lerp(PONDP[v].x, TEXTP[v].x, k), z: lerp(PONDP[v].z, TEXTP[v].z, k) });
// 第 1 段每一步：标题 → 石子（第 0 层）→ 第 1 圈 → 第 2 圈 → "第 3 圈碰到谁？" → 第 3 圈 → 摆回教材的图
const POND = (() => { const p = [{ k: 'title' }]; for (let L = 0; L <= MAXL; L++) { if (L === MAXL) p.push({ k: 'ask', L }); p.push({ k: 'ring', L }); } p.push({ k: 'flat' }); return p; })();

// =====================================================================
//  步骤表（每按一下走一步）
// =====================================================================
const SEC_NAMES = ['水波', '两样工具', '走一遍', '入队就标记', '序列唯一吗', '层号 = 最短边数', '非连通图与算法', '课堂小练', '小结'];
const SUMMARY_N = 4;
let STEPS = [], SEC_FIRST = {};
function buildSteps() {
  const p = practiceOf(CUR.ps); PR = p.run; PRA = p;
  const S = [], add = (o) => S.push(o);
  POND.forEach((st, n) => add({ sec: 1, kind: 'pond', n, lay: st.k === 'flat' ? 'walk' : 'pond', d3: true }));
  for (let n = 0; n <= 3; n++) add({ sec: 2, kind: 'tools', n, lay: 'walk', d3: true });
  WALK2.forEach((w, k) => add(Object.assign({ sec: 3, kind: 'walk', n: k, lay: 'walk', d3: true }, w)));
  for (let n = 0; n <= 4; n++) add({ sec: 4, kind: 'mark', n, lay: 'walk', d3: true });
  for (let n = 0; n <= 4; n++) add({ sec: 5, kind: 'redo', n, lay: 'walk', d3: true });
  for (let n = 0; n <= 7; n++) add({ sec: 5, kind: 'adj', n, lay: 'adj' });
  for (let n = 0; n <= 5; n++) add({ sec: 6, kind: 'lift', n, lay: 'walk', d3: true });
  for (let n = 0; n <= 6; n++) add({ sec: 7, kind: 'nc', n, lay: null, d3: true });
  for (let n = 0; n <= 5; n++) add({ sec: 7, kind: 'algo', n, lay: null });
  for (let n = 0; n <= 2; n++) add({ sec: 8, kind: 'prac', n, lay: 'prac' });
  for (let n = 0; n < SUMMARY_N; n++) add({ sec: 9, kind: 'end', n, lay: null });
  let last = 'pond';
  S.forEach((o) => { if (o.lay) last = o.lay; else o.lay = last; });
  SEC_FIRST = {}; S.forEach((o, i) => { if (SEC_FIRST[o.sec] === undefined) SEC_FIRST[o.sec] = i; });
  STEPS = S;
}
buildSteps();

// =====================================================================
//  事件时间表：一步里的事件一个接一个放（sp = 速度倍数，越小越快）
//  enq 前一半是"信使"沿边从 u 跑到 w，后一半插旗、入队、写进序列
// =====================================================================
const EVD = { start: 1.2, deq: 1.0, enq: 1.4, check: 1.0, done: 0.9 };
const LAND = { start: 0.05, deq: 0, enq: 0.45, check: 0.05, done: 0.05 };
const SP_REDO = 0.5, SP_ADJ = 0.6, SP_NC = 0.7, SP_PRAC = 0.5;
function schedule(ev, a, b, sp, t0) {
  const list = []; let t = t0 === undefined ? 0.15 : t0;
  for (let i = a; i <= b; i++) {
    const e = ev[i], key = e.t === 'visit' ? 'start' : e.t;
    const d = EVD[key] * sp, land = LAND[key] * d;
    list.push({ i, t, d, land, key }); t += d;
  }
  return { list, end: t };
}
// 这一刻的画面状态：snap = 已经"落地"的最后一个事件之后的队列 / visited / 序列；外加正在放的动画
// keepBars：红栅栏（看到来过的邻接点）一直留着（第 3 段一步只看一个顶点）；否则过一会儿就收起来（整遍快放时）
function runView(run, a, b, dt, sp, t0, keepBars) {
  const S = schedule(run.ev, a, b, sp, t0);
